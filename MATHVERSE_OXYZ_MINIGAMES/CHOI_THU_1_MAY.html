/* Đường mòn & vật cản trang trí trên bản đồ 2D */
.hw-path-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hw-obstacle{position:absolute;transform:translate(-50%,-50%);font-size:28px;pointer-events:none;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45));user-select:none}
.hw-wall-block{position:absolute;background:linear-gradient(180deg,#475569,#1e293b);border:2px solid #94a3b8;border-radius:8px;box-shadow:0 6px 0 #0f172a,0 8px 14px rgba(0,0,0,.45);z-index:3;pointer-events:none}
.theme-maze .hw-wall-block{background:linear-gradient(180deg,#0d9488,#115e59);border-color:#5eead4;box-shadow:0 6px 0 #042f2e}
.theme-crystal .hw-wall-block{background:linear-gradient(180deg,#7c3aed,#4c1d95);border-color:#c4b5fd;box-shadow:0 6px 0 #2e1065}

/* Trạm Quái Vật / Câu Hỏi trên bản đồ */
.hw-station{position:absolute;transform:translate(-50%,-50%);z-index:12;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.hw-station:hover{transform:translate(-50%,-50%) scale(1.08)}
.hw-ring{position:absolute;width:110px;height:110px;border-radius:50%;border:3px dashed rgba(250,204,21,.85);background:radial-gradient(circle,rgba(250,204,21,.24) 0%,rgba(250,204,21,.02) 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:hwSpin 12s linear infinite;pointer-events:none}
.hw-station.locked .hw-ring{border-color:rgba(148,163,184,.45);background:radial-gradient(circle,rgba(148,163,184,.12) 0%,transparent 70%);animation:none}
.hw-station.passed .hw-ring{border-color:rgba(52,211,153,.85);background:radial-gradient(circle,rgba(52,211,153,.25) 0%,transparent 70%);animation:none}
.hw-station-core{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#475569,#0f172a);border:3px solid #facc15;display:grid;place-items:center;font-size:34px;box-shadow:0 8px 20px rgba(0,0,0,.6);position:relative;z-index:2;animation:float 2.6s ease-in-out infinite}
.hw-station.locked .hw-station-core{border-color:#64748b;filter:grayscale(.65);opacity:.82;animation:none}
.hw-station.passed .hw-station-core{border-color:#10b981;background:radial-gradient(circle at 30% 30%,#065f46,#022c22);animation:none}
.hw-station-label{margin-top:6px;padding:4px 10px;border-radius:99px;background:rgba(15,23,42,.92);border:1.5px solid #facc15;color:#fef08a;font-size:11.5px;font-weight:900;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.5);z-index:3}
.hw-station.passed .hw-station-label{border-color:#34d399;color:#a7f3d0}
.hw-station.locked .hw-station-label{border-color:#64748b;color:#cbd5e1}

/* Rương kho báu chặng */
.hw-chest{position:absolute;transform:translate(-50%,-50%);z-index:11;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.hw-chest-box{width:68px;height:68px;border-radius:18px;background:radial-gradient(circle,#fef08a,#ca8a04);border:3px solid #fff;display:grid;place-items:center;font-size:36px;box-shadow:0 0 28px rgba(250,204,21,.75)}
.hw-chest.locked .hw-chest-box{filter:grayscale(.7);opacity:.65;box-shadow:none}

/* Nhân vật của Đội trên bản đồ */
.hw-player{position:absolute;transform:translate(-50%,-50%);z-index:20;pointer-events:none;transition:left 55ms linear,top 55ms linear;display:flex;flex-direction:column;align-items:center}
.hw-player-torch{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,243,176,.28) 0%,rgba(255,243,176,.05) 55%,transparent 72%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hw-player-avatar{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff,#dbeafe);border:3px solid #38bdf8;box-shadow:0 0 18px rgba(56,189,248,.8),0 8px 14px rgba(0,0,0,.55);display:grid;place-items:center;font-size:30px;position:relative;z-index:2}
.hw-player.moving .hw-player-avatar{animation:hwBounce .32s infinite alternate}
.hw-player-name{margin-top:4px;padding:2px 9px;border-radius:99px;background:#0284c7;color:#fff;font-size:11px;font-weight:900;white-space:nowrap;border:1px solid #bae6fd;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.hw-ripple{position:absolute;width:36px;height:36px;border-radius:50%;border:2.5px solid #38bdf8;transform:translate(-50%,-50%);pointer-events:none;z-index:15;animation:hwRipple .55s ease-out forwards}

/* D-Pad ảo & Hướng dẫn điều khiển trên Viewport */
.hw-controls-overlay{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:25}
.hw-dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:5px;pointer-events:auto;background:rgba(15,23,42,.78);padding:7px;border-radius:16px;border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(4px)}
.hw-dpad button{width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(30,41,59,.92);color:#fff;font-size:18px;font-weight:900;display:grid;place-items:center;padding:0}
.hw-dpad button:active{background:#0284c7;transform:scale(.94)}
.hw-action-panel{pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hw-attack-station-btn{border:2px solid #fde047;background:linear-gradient(135deg,#eab308,#ca8a04);color:#1e1b4b;font-weight:950;font-size:14px;padding:11px 18px;border-radius:14px;box-shadow:0 8px 22px rgba(234,179,8,.5);animation:pulse 1.2s infinite}
.hw-hint-pill{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.2);color:#e2e8f0;padding:6px 12px;border-radius:10px;font-size:11.5px;font-weight:750}

/* Cửa sổ Chiến Đấu Cuộn Giấy Cổ (Battle Scroll Modal giống hunt-preview) */
.hw-battle-backdrop{position:fixed;inset:0;background:rgba(9,13,26,.82);z-index:70;display:grid;place-items:center;padding:16px;backdrop-filter:blur(5px)}
.hw-battle-modal{width:min(900px,100%);background:linear-gradient(160deg,#fdf6e3 0%,#f5e6c4 100%);border:4px solid #8b5e2b;border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.75),inset 0 0 0 2px #c8a96e;color:#3d2a14;overflow:hidden;display:grid;grid-template-columns:1.35fr .85fr;position:relative;max-height:92vh}
.hw-battle-scroll{padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto}
.hw-scroll-kicker{display:inline-flex;align-items:center;gap:6px;background:#8b5e2b;color:#fffdf5;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.06em;width:fit-content;margin-bottom:8px}
.hw-scroll-role{background:rgba(139,94,43,.12);border-left:4px solid #8b5e2b;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:800;color:#5d3a18;margin-bottom:12px}
.hw-scroll-question{font-size:clamp(16px,1.8vw,20px);font-weight:900;color:#2b1b0c;line-height:1.45;margin-bottom:14px;padding:12px 14px;background:rgba(255,255,255,.68);border:1.5px solid #d6c096;border-radius:14px}
.hw-scroll-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.hw-opt-btn{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;border:2px solid #c8a96e;background:#fffdf7;color:#3d2a14;font-weight:850;font-size:15px;text-align:left}
.hw-opt-btn span.opt-letter{width:30px;height:30px;border-radius:8px;background:#c8a96e;color:#3d2a14;display:grid;place-items:center;font-family:monospace;font-weight:900;flex-shrink:0}
.hw-opt-btn.selected{background:linear-gradient(135deg,#8b5e2b,#6b441d);color:#fffdf5;border-color:#5d3a18;box-shadow:0 4px 12px rgba(93,58,24,.35)}
.hw-opt-btn.selected span.opt-letter{background:rgba(255,255,255,.25);color:#fff}
.hw-short-box{display:flex;gap:8px;align-items:center;margin-bottom:12px;background:rgba(255,255,255,.6);padding:8px 11px;border-radius:12px;border:1.5px dashed #b08d57}
.hw-short-box input{flex:1;border:1.5px solid #c8a96e;border-radius:9px;padding:8px 11px;background:#fff;color:#2b1b0c;font-weight:800}
.hw-scroll-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:2px dashed rgba(139,94,43,.3);flex-wrap:wrap}
.hw-btn-flee{border:2px solid #c8a96e;background:#fdf6e3;color:#6b4d28;border-radius:12px;padding:10px 15px;font-weight:800}
.hw-btn-attack{border:2px solid #c8a96e;background:linear-gradient(135deg,#8b5e2b,#5d3a18);color:#fff;border-radius:12px;padding:11px 22px;font-weight:900;font-size:15px;box-shadow:0 6px 16px rgba(93,58,24,.35)}
.hw-monster-stage{background:radial-gradient(circle at 50% 40%,#3b2d54 0%,#1a1426 85%);color:#fff;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border-left:3px solid #8b5e2b;text-align:center}
.hw-monster-hp{width:85%;background:#0f0a06;border:2px solid #c8a96e;border-radius:99px;height:14px;overflow:hidden;margin-bottom:8px}
.hw-monster-hp i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f97316);transition:width .3s}
.hw-monster-sprite{font-size:96px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.6));animation:float 2.4s ease-in-out infinite;margin:10px 0;position:relative}
.hw-monster-sprite.defeated{transform:scale(.2) rotate(25deg);opacity:.15;transition:all .5s}
.hw-monster-impact{position:absolute;font-size:78px;animation:hwPop .5s ease-out}
.hw-letter-reward-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(22,163,74,.96),rgba(20,83,45,.98));z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff}
.hw-letter-card{width:110px;height:110px;border-radius:24px;background:linear-gradient(160deg,#fffdf5,#f3e3c2);color:#15803d;border:4px solid #facc15;display:grid;place-items:center;font-size:32px;font-weight:950;box-shadow:0 0 35px rgba(250,204,21,.8);animation:hwLetterFly .65s cubic-bezier(.34,1.56,.64,1)}

/* ═══════════════════════════════════════════════════════════════════════════
   ENGINE 2: BẢO VỆ THÀNH TRÌ (CASTLE DEFENSE - THEO MẪU GIAOVIENSANGTAO.VN)
   ═══════════════════════════════════════════════════════════════════════════ */
.cd-game{background:#181009;color:#fff4dc;border:3px solid #8c5820;border-radius:18px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.cd-hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:linear-gradient(180deg,#2c1b10,#1a1009);border-bottom:3px solid #7c4d1b;flex-wrap:wrap}
.cd-hud-stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}
.cd-stat{display:flex;align-items:center;gap:8px;background:rgba(15,9,5,.72);border:1.5px solid #8d5b24;border-radius:12px;padding:6px 11px;min-width:115px}
.cd-stat-icon{font-size:20px}
.cd-stat small{display:block;font-size:10px;color:#e7cfa1;font-weight:800;text-transform:uppercase}
.cd-stat strong{font-size:14px;color:#fff7df;font-weight:950}
.cd-bar{width:100%;height:7px;background:#0e0905;border-radius:99px;overflow:hidden;margin-top:3px;border:1px solid #472c11}
.cd-bar i{display:block;height:100%;border-radius:99px;transition:width .25s}
.cd-bar.hp i{background:linear-gradient(90deg,#ef4444,#84cc16)}
.cd-bar.xp i{background:linear-gradient(90deg,#0ea5e9,#67e8f9)}

.cd-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px}
.cd-main-col{display:flex;flex-direction:column;min-width:0}

/* Chiến trường 3 làn đường (Battlefield) */
.cd-battlefield{position:relative;height:290px;overflow:hidden;border-bottom:4px solid #593714;background:linear-gradient(180deg,#1d3557 0%,#457b9d 34%,#4f8732 35%,#3f7227 68%,#2f591c 100%);isolation:isolate}
.cd-sky-decor{position:absolute;top:10px;left:22px;color:rgba(255,255,255,.65);font-size:13px;font-weight:800;letter-spacing:2px;z-index:1;pointer-events:none}
.cd-lane-guide{position:absolute;left:18%;right:0;height:1px;border-top:1.5px dashed rgba(255,248,196,.25);pointer-events:none}
.cd-lane-0{top:43%}
.cd-lane-1{top:64%}
.cd-lane-2{top:85%}

/* Dock 4 Kỹ năng chủ động góc trên phải Chiến trường */
.cd-skill-dock{position:absolute;top:10px;right:10px;z-index:22;display:flex;gap:6px;padding:5px;background:rgba(16,11,8,.82);border:2px solid rgba(250,204,21,.65);border-radius:12px;backdrop-filter:blur(4px)}
.cd-skill-btn{width:48px;height:48px;border-radius:10px;border:2px solid #855823;background:linear-gradient(160deg,#2b1c10,#140c06);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;position:relative;font-size:20px}
.cd-skill-btn small{font-size:8.5px;font-weight:900;color:#fde68a;line-height:1}
.cd-skill-btn.active{border-color:#38bdf8;background:linear-gradient(160deg,#0369a1,#0c4a6e);box-shadow:0 0 14px #38bdf8}
.cd-skill-btn.cooldown{opacity:.6;cursor:not-allowed}
.cd-skill-cd{position:absolute;inset:0;background:rgba(0,0,0,.72);border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:950;color:#facc15}

/* Thành trì & Khiên chắn bên trái */
.cd-castle{position:absolute;left:1%;bottom:4%;width:125px;height:82%;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cd-castle-art{font-size:86px;line-height:1;filter:drop-shadow(6px 8px 8px rgba(0,0,0,.45))}
.cd-castle-tag{background:rgba(18,12,7,.88);border:1.5px solid #eab308;color:#fef08a;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:900;white-space:nowrap}
.cd-castle-shield{position:absolute;inset:5% -10% 2% 0;border:4px solid rgba(56,189,248,.8);border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.12),rgba(14,165,233,.32));box-shadow:0 0 24px rgba(56,189,248,.8),inset 0 0 18px rgba(56,189,248,.65);animation:pulse 1.5s infinite;pointer-events:none}

/* 3 Anh Hùng trấn giữ 3 làn */
.cd-hero{position:absolute;left:15%;transform:translate(-50%,-50%);z-index:6;display:flex;flex-direction:column;align-items:center}
.cd-hero-sprite{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fef3c7,#d97706);border:2.5px solid #fff;display:grid;place-items:center;font-size:25px;box-shadow:0 5px 12px rgba(0,0,0,.5)}
.cd-hero-label{font-size:9.5px;font-weight:900;background:rgba(0,0,0,.75);color:#fde68a;padding:1px 6px;border-radius:6px;margin-top:2px;white-space:nowrap}

/* Quái vật di chuyển trên 3 làn */
.cd-enemy{position:absolute;transform:translate(-50%,-50%);z-index:7;display:flex;flex-direction:column;align-items:center;transition:left 50ms linear}
.cd-enemy-hp{width:42px;height:6px;background:#1c1917;border:1px solid #000;border-radius:99px;overflow:hidden;margin-bottom:2px}
.cd-enemy-hp i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f97316)}
.cd-enemy-sprite{font-size:36px;line-height:1;filter:drop-shadow(0 5px 6px rgba(0,0,0,.45))}
.cd-enemy.is-boss .cd-enemy-sprite{font-size:50px}
.cd-enemy.is-slowed .cd-enemy-sprite{filter:drop-shadow(0 0 8px #38bdf8) hue-rotate(160deg)}

/* Đạn bắn & Hiệu ứng nổ sát thương */
.cd-proj{position:absolute;transform:translate(-50%,-50%);z-index:8;font-size:18px;pointer-events:none;filter:drop-shadow(0 0 6px #fde047)}
.cd-fx{position:absolute;transform:translate(-50%,-50%);z-index:15;font-weight:950;font-size:15px;color:#fde047;text-shadow:0 2px 4px #000;pointer-events:none;animation:cdFloatUp .75s ease-out forwards;white-space:nowrap}
.cd-fx.crit{font-size:20px;color:#4ade80}
.cd-fx.hit-castle{color:#f87171;font-size:18px}

/* Khu vực Câu Hỏi Toán Học dưới Chiến trường (Question Dock) */
.cd-question-dock{background:linear-gradient(180deg,#f7ebd2,#edd8b1);color:#2d1d0e;padding:16px 18px}
.cd-q-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.cd-q-badge{background:#7c4a15;color:#fff7e0;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:900}
.cd-q-reward{background:#15803d;color:#fff;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:900}
.cd-q-prompt{font-size:clamp(16px,1.85vw,19.5px);font-weight:900;color:#231508;background:rgba(255,255,255,.72);border:2px solid #c69c63;border-radius:13px;padding:11px 14px;margin-bottom:11px;line-height:1.45}
.cd-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.cd-ans-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid #966125;background:linear-gradient(180deg,#fff9ea,#f3dfb9);color:#2d1d0e;font-weight:900;font-size:15px;text-align:left;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 3px 0 #794815}
.cd-ans-btn:hover:not(:disabled){background:linear-gradient(180deg,#fffdf5,#fae8c6)}
.cd-ans-btn span.ans-letter{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#a66a20,#70400f);color:#fff4c7;display:grid;place-items:center;font-size:13px;font-weight:950;flex-shrink:0}
.cd-q-InputRow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cd-q-InputRow input{flex:1;min-width:160px;border:2px solid #966125;border-radius:10px;padding:8px 12px;background:#fffaf0;color:#26180d;font-weight:800}

/* Cột phải: Bảng Nâng Cấp Đội Quân (Upgrade Panel) */
.cd-upgrade-panel{background:linear-gradient(180deg,#23160c,#160d07);border-left:3px solid #6e4215;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.cd-up-title{font-size:13px;font-weight:950;color:#fcd34d;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.cd-up-list{display:flex;flex-direction:column;gap:8px}
.cd-up-item{background:rgba(255,255,255,.05);border:1.5px solid #6e4215;border-radius:12px;padding:9px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cd-up-info b{display:block;font-size:12.5px;color:#fff4dc}
.cd-up-info small{font-size:11px;color:#fbbf24;font-weight:800}
.cd-up-buy{border:1.5px solid #f59e0b;background:linear-gradient(180deg,#d97706,#92400e);color:#fff;border-radius:9px;padding:6px 10px;font-size:11.5px;font-weight:900;white-space:nowrap}
.cd-up-buy:disabled{opacity:.45;border-color:#57534e;background:#292524}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,.55)}50%{box-shadow:0 0 0 8px rgba(250,204,21,0)}}
@keyframes hwSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes hwBounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-5px) scale(1.05)}}
@keyframes hwRipple{0%{width:12px;height:12px;opacity:1}100%{width:70px;height:70px;opacity:0}}
@keyframes hwPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes hwLetterFly{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes cdFloatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-34px);opacity:0}}

@media(max-width:1050px){
  .teacher-main,.mission-wrapper,.cd-layout{grid-template-columns:1fr}
  .cd-upgrade-panel{border-left:0;border-top:3px solid #6e4215}
  .cd-up-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .role-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:720px){
  .wrap{padding:12px 10px 45px}
  .hero{border-radius:20px;padding:24px 18px;min-height:210px}
  .hero-character{font-size:70px;right:10px;top:30px;opacity:.4}
  .grid-2,.grid-3,.grid-4,.cd-answers,.hw-scroll-options,.cd-up-list,.role-strip{grid-template-columns:1fr}
  .hw-battle-modal{grid-template-columns:1fr}
  .hw-monster-stage{border-left:0;border-top:3px solid #8b5e2b;padding:16px}
  .hw-viewport{height:390px}
  .cd-battlefield{height:240px}
}

let demoRoom=initDemo();
function offErr(msg){throw new Error(msg);}
function offEvent(s){demoRoom.events.push({text:s,at:new Date().toISOString()});}
function normAns(s){return String(s??'').trim().replace(/\u2212/g,'-').replace(/\s+/g,'').toUpperCase();}
function publicStageDemo(s,round){

 return {
  id:s.id,title:s.title,place:s.place,icon:s.icon,tag:s.tag,time:s.time,
  story:s.story,groupTask:s.groupTask,gameType:s.gameType,defaultMode:s.defaultMode||(s.id===2||s.id===5?'defense':'hunt'),
  teamRoles:s.teamRoles||[],huntMap:s.huntMap||null,defenseConfig:s.defenseConfig||null,
  allRounds:s.challenges.map((c,i)=>({index:i,label:c.label,keyBadge:c.keyBadge||'Mảnh '+(i+1),monster:c.monster||{icon:'👾',name:'Quái Vật',hp:100}})),

 };
}
function offState(d){
 let r=demoRoom,gv=d.token===r.teacherToken,t=r.teams.find(x=>x.token===d.token);
 if(!gv&&!t)offErr('Mã truy cập không hợp lệ.');
 const teams=r.teams.map(x=>({id:x.id,name:x.name,avatar:x.avatar,color:x.color,stage:x.stage,round:x.round,health:x.health,wrong:x.wrong,score:x.score,bonus:x.bonus,gold:x.gold,heroLevel:x.heroLevel,upgrades:x.upgrades,completed:x.completed,finishedAt:x.finishedAt}));
 let clk={...r.clock};
 if(clk.running)clk.remainingMs=Math.max(0,clk.remainingMs-(Date.now()-clk.startedAt));
 let data={room:r.id,role:gv?'teacher':'student',teams,paused:r.paused,clock:clk,stages:offStages.map(m=>({id:m.id,title:m.title,icon:m.icon,place:m.place,tag:m.tag,gameType:m.gameType,defaultMode:m.defaultMode,totalRounds:3})),messageOptions:offOptions,lastEvent:r.events.slice(-15).reverse(),createdAt:new Date().toISOString(),joinBaseURL:'Bản chơi thử 1 máy'};
 if(gv)return {...data,teamCodes:Object.fromEntries(r.teams.map(x=>[x.id,x.code])),missions:offStages.map(m=>({...m,challenges:m.challenges.map(q=>({...q,answer:'ABCD'[q.correct]}))})),teacherToken:r.teacherToken,cipher:'30524',cipherWords:offWords};
 let m=offStages[t.stage];
 return {...data,me:{...t},current:m?publicStageDemo(m,t.round):null,cipherWords:t.stage>=5?offWords:null};
}
async function demoApi(route,d){
 let r=demoRoom;
 if(route==='/api/create'){r=demoRoom=initDemo();return {room:r.id,teacherToken:r.teacherToken};}
 if(route==='/api/join'){
  let team=r.teams.find(x=>x.id===d.team&&x.code===String(d.code));
  if(!team)offErr('Sai mã đội. Đội 1: 1111 · Đội 2: 2222 · Đội 3: 3333 · Đội 4: 4444');
  return {room:r.id,team:team.id,token:team.token};
 }
 if(route==='/api/state')return offState(d);
 let t=r.teams.find(x=>x.token===d.token);
 if(route==='/api/teacher'){
  if(d.token!==r.teacherToken)offErr('Chỉ GV được thao tác');
  if(d.action==='bonus'){let x=r.teams.find(x=>x.id===d.team);x.score+=Number(d.value)-x.bonus;x.bonus=Number(d.value);}
  else if(d.action==='pause'){r.paused=!r.paused;}
  else if(d.action==='resetTeam'){let x=r.teams.find(x=>x.id===d.team);let base=initDemo().teams.find(v=>v.id===d.team);Object.assign(x,base);}
  else if(d.action==='timer'){
   if(d.value==='start'){r.clock.running=true;r.clock.startedAt=Date.now();}
   else if(d.value==='pause'){r.clock.remainingMs=Math.max(0,r.clock.remainingMs-(Date.now()-r.clock.startedAt));r.clock.running=false;}
   else if(d.value==='reset'){r.clock.running=false;r.clock.remainingMs=r.clock.minutes*60000;}
   else{r.clock.minutes=Number(d.value);r.clock.remainingMs=Number(d.value)*60000;r.clock.running=false;}
  }
  return {ok:true};
 }
 if(!t)offErr('Đội chưa đăng nhập');
 if(route==='/api/demoJump'){
  const stg=Math.max(0,Math.min(5,Number(d.stage)||0));
  t.stage=stg;t.round=0;t.health=3;t.completed=false;
  t.digits=offStages.slice(0,stg).map((s,idx)=>({stage:idx+1,digit:s.digit,rule:s.digitRule,item:s.item}));
  t.score=stg*20;
  return {ok:true};
 }
 if(r.paused)offErr('GV đang tạm dừng game');
 if(route==='/api/answer'){
  if(t.stage!==Number(d.stage)||t.round!==Number(d.round))offErr('Nhiệm vụ thay đổi, hãy tải lại');
  let s=offStages[t.stage],q=s.challenges[t.round];
  let isCorrect=false;
  if(d.shortText!==undefined&&String(d.shortText).trim()!==''){
   const given=normAns(d.shortText);
   const targetShort=normAns(q.shortAnswer);
   const targetOpt=normAns(q.options[q.correct]);
   const targetLetter=String.fromCharCode(65+q.correct);
   isCorrect=(targetShort&&given===targetShort)||given===targetOpt||given===targetLetter;
  }else{
   isCorrect=(Number(d.choice)===q.correct);
  }
  if(isCorrect){
   t.round++;let pts=0,digit=null,goldEarned=120;
   t.gold=(t.gold||100)+goldEarned;
   if(t.round===3){
    pts=t.attempts[t.stage]===0&&!t.hintsUsed[t.stage]?20:t.attempts[t.stage]<=2?12:8;
    t.score+=pts;t.gold+=80;t.heroLevel=Math.min(6,(t.heroLevel||1)+1);
    digit=s.digit;
    t.digits.push({stage:t.stage+1,digit:s.digit,rule:s.digitRule,item:s.item});
    t.stage++;t.round=0;t.health=3;
    offEvent(t.avatar+' '+t.name+' vượt Chặng '+s.id+' và nhận mảnh mã '+digit);
   }else{
    offEvent(t.avatar+' '+t.name+' vượt lượt '+t.round+'/3 tại '+s.place);
   }
   return {correct:true,points:pts,goldEarned,gold:t.gold,heroLevel:t.heroLevel,explain:q.explain,keyBadge:q.keyBadge,roundFinished:true,stageFinished:digit!==null,digit,digitRule:digit?s.digitRule:undefined,item:digit?s.item:undefined,nextRound:t.round,nextStage:t.stage,health:t.health,score:t.score};
  }
  t.attempts[t.stage]++;t.wrong++;t.health=Math.max(0,t.health-1);
  return {correct:false,hint:q.hints[Math.min(t.attempts[t.stage]-1,q.hints.length-1)],health:t.health,tries:t.attempts[t.stage],gold:t.gold};
 }
 if(route==='/api/upgrade'){
  const key=String(d.upgrade||'');
  const curLv=t.upgrades[key]||1;
  if(curLv>=5)offErr('Chỉ số này đã đạt cấp tối đa (Lv.5)!');
  const cost=60+curLv*40;
  if((t.gold||0)<cost)offErr('Không đủ Vàng! Cần '+cost+' Vàng. Hãy giải câu hỏi để nhận thêm Vàng.');
  t.gold-=cost;t.upgrades[key]=curLv+1;
  if(key==='hp'||key==='regen')t.health=Math.min(3,t.health+1);
  return {ok:true,gold:t.gold,upgrades:t.upgrades,health:t.health,cost,level:t.upgrades[key]};
 }
 if(route==='/api/hint'){
  let q=offStages[t.stage].challenges[t.round];
  t.hintsUsed[t.stage]=true;
  return {hint:q.hints[0],cost:'Điểm chặng tính theo số lần sai và gợi ý.'};
 }
 if(route==='/api/final'){
  if(t.stage!==5)offErr('Chưa thu đủ 5 mảnh mã');
  if(t.completed)offErr('Đội đã hoàn thành');
  if(String(d.code||'').trim()==='30524'&&Number(d.choice)===0){
   t.completed=true;t.finishedAt=new Date().toISOString();t.score+=20;
   offEvent('🏆 '+t.name+' mở Rương Lõi Trí Tuệ thành công!');
   return {correct:true,points:20,message:offOptions[0],score:t.score};
  }
  return {correct:false,hint:String(d.code||'').trim()==='30524'?'Chọn đúng thông điệp từ bảng giải mã.':'Ghép 5 chữ số theo thứ tự Chặng 1 → 5 (30524).'};
 }
 offErr('Tác vụ không hỗ trợ trong bản demo');
}

 }).join('');

 }).join('');

 const pathPts=[hm.spawn,...stList,hm.chest].map(p=>`${Math.round(p.x*12)},${Math.round(p.y*8.2)}`).join(' ');

 const stationsHtml=stList.map((st,i)=>{
  const state=i<r?'passed':i===r?'active':'locked';
  return `<div class="hw-station ${state}" style="left:${st.x}%;top:${st.y}%" data-action="clickStation" data-idx="${i}">
   <div class="hw-ring"></div>
   <div class="hw-station-core">${i<r?'✅':st.monsterIcon||'👾'}</div>

function updateHuntCamera(){
 const vp=$('#hwViewport'), wd=$('#hwWorld'), pl=$('#hwPlayer');
 if(!vp||!wd||!pl)return;
 pl.style.left=huntState.x+'%';
 pl.style.top=huntState.y+'%';
 pl.classList.toggle('moving',huntState.moving);
 const vw=vp.clientWidth||800, vh=vp.clientHeight||470;
 const ww=1200, wh=820;
 const px=huntState.x/100*ww, py=huntState.y/100*wh;
 const tx=Math.min(0,Math.max(vw-ww,vw/2-px));
 const ty=Math.min(0,Math.max(vh-wh,vh/2-py));
 wd.style.transform=`translate3d(${Math.round(tx)}px,${Math.round(ty)}px,0)`;
}

function initCastleForStage(m){
 const up=world?.me?.upgrades||{damage:1,speed:1,hp:1,regen:1};
 const maxHp=260+up.hp*40;
 cdState.castleMaxHp=maxHp;
 if(cdState.stageId!==m.id){
  cdState.stageId=m.id;
  cdState.castleHp=maxHp;
  cdState.enemies=[];
  cdState.projectiles=[];
  cdState.effects=[];
  cdState.lastSpawnAt=0;
  spawnCastleWaveEnemies(m);
 }
}

function spawnCastleWaveEnemies(m){
 if(!m||!m.defenseConfig)return;
 const w=m.defenseConfig.waves?.[m.round]||{name:'Đợt tấn công',enemies:['goblin','bat','skeleton'],boss:'👹'};
 const list=w.enemies||['goblin','bat','skeleton'];
 const spriteMap={goblin:'👺',bat:'🦇',skeleton:'💀',orc:'👹'};
 list.forEach((kind,idx)=>{
  const hp=75+m.id*20+m.round*15;
  cdState.enemies.push({
   id:'en-'+(++cdState.seq),
   lane:idx%3,
   x:84+idx*5,
   hp, maxHp:hp,
   speed:2.1+(idx%2)*0.4,
   sprite:spriteMap[kind]||'👺',
   isBoss:false
  });
 });
 // Thêm Thủ lĩnh của Đợt
 const bossHp=160+m.id*35+m.round*25;
 cdState.enemies.push({
  id:'boss-'+(++cdState.seq),
  lane:1,
  x:94,
  hp:bossHp, maxHp:bossHp,
  speed:1.45,
  sprite:w.boss||m.challenge?.monster?.icon||'👹',
  isBoss:true
 });
}

function render(){
 if(!session)return startScreen();
 if(!world){app.innerHTML='<div class="loading">Đang lấy dữ liệu phòng học…</div>';return;}
 app.innerHTML=layout(session.role==='teacher'?teacherScreen():studentScreen());
 updateClock();
 updateHuntCamera();
 $('.award-backdrop')?.remove();
 if(showAward&&session.role==='teacher'){
  const aw=document.createElement('div');aw.innerHTML=awardScreen();document.body.appendChild(aw.firstElementChild);
 }
 if(modal)showModal();
}

function showModal(){
 if(!modal)return;
 const old=$('.modal-backdrop');if(old)old.remove();
 let good=modal.good;
 const el=document.createElement('div');
 el.className='modal-backdrop';
 el.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-icon">${good?'🎉':'🧩'}</div><h2 class="${good?'success':'failure'}">${esc(modal.title)}</h2><p>${esc(modal.message)}</p>${modal.explain?`<p class="notice good">${esc(modal.explain)}</p>`:''}${modal.digit!==undefined&&modal.digit!==null?`<div class="reward">🔑 MẢNH MẬT MÃ CHẶNG: ${esc(modal.digit)}</div>`:''}${modal.points?`<div class="reward">⭐ +${modal.points} XP</div>`:''}${modal.goldEarned?`<div class="reward">🪙 +${modal.goldEarned} Vàng</div>`:''}${btn(modal.button||'Tiếp tục hành trình','closeModal',good?'teal block':'primary block')}</div>`;
 document.body.appendChild(el);
}
function notice(title,message,good=false,extra={}){modal={title,message,good,...extra};showModal();sound(good);}
function sound(good){
 if(!soundEnabled)return;
 try{
  const actx=new(window.AudioContext||window.webkitAudioContext)();
  let base=good?520:230;
  [0,.11,.22].forEach((offset,i)=>{
   const osc=actx.createOscillator(),gain=actx.createGain();
   osc.type='sine';osc.frequency.value=base+(good?i*170:-i*35);
   gain.gain.setValueAtTime(.0001,actx.currentTime+offset);
   gain.gain.exponentialRampToValueAtTime(.07,actx.currentTime+offset+.012);
   gain.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+offset+.13);
   osc.connect(gain).connect(actx.destination);
   osc.start(actx.currentTime+offset);osc.stop(actx.currentTime+offset+.14);
  });
  setTimeout(()=>actx.close(),700);
 }catch(e){}
}

function setClock(){clockBase=world?.clock||null;tickBase=Date.now();updateClock();}
function updateClock(){
 if(!clockBase)return;
 const node=$('#clock');if(!node)return;
 let remaining=clockBase.remainingMs-(clockBase.running?Date.now()-tickBase:0);
 remaining=Math.max(0,remaining);
 const sec=Math.floor(remaining/1000);
 node.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
 node.classList.toggle('warn',sec<=300);
}

async function refresh(force=false){
 if(!session||busy)return;
 try{
  const d=await api('/api/state',{room:session.room,token:session.token});
  world=d;setClock();
  if(session.role==='student'&&!force){
   const me=d.me||{};
   const studentKey=`${me.stage}_${me.round}_${me.completed}_${d.paused}`;
   if(studentKey===lastStudentKey){
    // Chỉ cập nhật bảng xếp hạng bên cạnh để không làm gián đoạn bản đồ 2D hoặc chiến trường Thủ Thành
    const ranksEl=$('#studentSidebarRanks');
    if(ranksEl)ranksEl.innerHTML=standings(d.teams,true);
    const rank=[...d.teams].sort((a,b)=>b.score-a.score),mineRank=rank.findIndex(t=>t.id===me.id)+1;
    const metricsEl=$('#studentSidebarMetrics');
    if(metricsEl)metricsEl.innerHTML=`<div class="metric"><b>${me.score}</b><small>XP CỦA ĐỘI</small></div><div class="metric"><b>#${mineRank}</b><small>HẠNG TẠM THỜI</small></div>`;
    return;
   }
   lastStudentKey=studentKey;
  }
  if(session.role==='student'&&d.me){
   lastStudentKey=`${d.me.stage}_${d.me.round}_${d.me.completed}_${d.paused}`;
  }
  let slim={...d,clock:{...d.clock,remainingMs:0}};
  const sig=JSON.stringify(slim);
  if(force||sig!==lastSignature){
   lastSignature=sig;
   const focused=document.activeElement?.matches('input,select,textarea');
   if(modal||focused||huntState.battleOpen)return;
   render();
  }
 }catch(e){
  if(force){session=null;world=null;startScreen(e.message);}
 }
}

async function submit(route,payload){
 if(busy)return;
 busy=true;
 try{return await api(route,{room:session.room,token:session.token,...payload});}
 finally{busy=false;}
}
function updateAfterAction(){lastSignature='';lastStudentKey='';setTimeout(()=>refresh(true),150);}

async function submitStageAnswer(payload){
 if(world.paused)return notice('Tạm dừng','Giáo viên đang tạm dừng nhiệm vụ.',false);
 const curMode=activePlayMode||world.current?.defaultMode||'hunt';
 const result=await submit('/api/answer',{stage:world.me.stage,round:world.me.round,...payload});
 if(result.correct){
  sound(true);
  // Nếu đang ở chế độ Bảo Vệ Thành Trì: kích hoạt Pháo Kích Tọa Độ diệt toàn bộ quái trên màn hình!
  if(curMode==='defense'){
   cdState.enemies.forEach(en=>{
    cdState.effects.push({id:++cdState.seq,x:en.x,lane:en.lane,text:'💥 PHÁO KÍCH -999!',cls:'crit',until:performance.now()+900});
   });
   cdState.enemies=[];
  }
  if(result.stageFinished){
   huntState.battleOpen=false;
   huntState.monsterDefeated=false;
   huntState.rewardBadge=null;
   activePlayMode=null; // Để chặng mới tự chọn defaultMode của chặng đó
   notice('🏆 CHINH PHỤC CHẶNG THÀNH CÔNG!',`Đội đã thu hồi vật phẩm "${result.item}"! Quy tắc mật mã: ${result.digitRule}`,true,
    {explain:result.explain,digit:result.digit,points:result.points,goldEarned:result.goldEarned,button:result.nextStage===5?'Tiến tới Mở Rương Lõi Trí Tuệ →':'Bước sang Chặng tiếp theo →'});
   updateAfterAction();
  }else if(curMode==='hunt'&&huntState.battleOpen){
   // Hiện hiệu ứng nổ Quái vật & bay Mảnh Chìa Khóa ngay trong Battle Modal giống hunt-preview
   huntState.monsterDefeated=true;
   huntState.rewardBadge=result.keyBadge||`Lượt ${result.nextRound}`;
   huntState.rewardExplain=result.explain;
   render();
  }else{
   notice('💥 PHÁO KÍCH CHÍNH XÁC!',`Đợt quái vật thứ ${world.me.round+1} đã bị tiêu diệt hoàn toàn! Đội nhận thêm +${result.goldEarned||120} Vàng.`,true,
    {explain:result.explain,goldEarned:result.goldEarned||120,button:`Tiếp tục Đợt ${result.nextRound+1}/3 →`});
   updateAfterAction();
  }
 }else{
  sound(false);
  const x=result.health===0?'Đội đã cạn khiên nhưng NOVA đã sạc lại năng lượng để đội thử tiếp! ':'';
  notice('🛡️ CHƯA CHÍNH XÁC – HÃY TÍNH LẠI!',x+'Gợi ý từ NOVA: '+result.hint,false,{button:'↺ Thử lại ngay'});
  updateAfterAction();
 }
}

async function handle(action,el){
 try{
  if(action==='demoPlay'){saveSession({role:'student',room:'123456',teamId:'doi-1',token:'DEMO_DOI_1'});activePlayMode=null;await refresh(true);return;}
  if(action==='demoTeacher'){saveSession({role:'teacher',room:'123456',token:'DEMO_GV'});await refresh(true);return;}
  if(action==='demoJumpStage'){
   const stg=Number(el.dataset.stage);
   await submit('/api/demoJump',{stage:stg});
   activePlayMode=null;
   huntState.battleOpen=false;
   huntState.stageId=-1;
   cdState.stageId=-1;
   await refresh(true);
   return;
  }
  if(action==='toggleSound'){soundEnabled=!soundEnabled;render();return;}
  if(action==='switch-tab'){$('.tabs .active')?.classList.remove('active');el.classList.add('active');$('[data-tabbox="'+el.dataset.tab+'"]')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(action==='create'){el.disabled=true;const count=Number($('#teamCount').value);const r=await api('/api/create',{teamCount:count});saveSession({role:'teacher',room:r.room,token:r.teacherToken});await refresh(true);return;}
  if(action==='join'){el.disabled=true;const room=$('#roomInput').value.trim(),team=$('#teamSelect').value,code=$('#teamCode').value.trim();const r=await api('/api/join',{room,team,code});saveSession({role:'student',room:r.room,teamId:r.team,token:r.token});await refresh(true);return;}
  if(action==='home'){const yes=confirm('Quay về màn hình đăng nhập? Tiến độ của đội vẫn được lưu an toàn.');if(yes){session=null;world=null;history.replaceState({},'',location.pathname);startScreen();}return;}
  if(action==='setMode'){
   activePlayMode=el.dataset.mode;
   huntState.battleOpen=false;
   render();
   return;
  }
  /* ─── ACTIONS CHO SĂN KHO BÁU 2D ─── */
  if(action==='walkToStation'||action==='clickStation'){
   const idx=Number(el.dataset.idx);
   const m=world?.current;if(!m)return;
   const st=m.huntMap?.stations?.[idx];
   if(!st)return;
   if(idx>m.round){
    return notice('🔒 Trạm đang khóa',`Hãy vượt qua Trạm ${m.round+1} trước khi tiến tới Trạm ${idx+1}!`,false);
   }
   if(idx<m.round){
    return notice('✅ Trạm đã hoàn thành',`Đội đã thu hồi chìa khóa ở Trạm ${idx+1} rồi. Hãy tiến tới Trạm ${m.round+1}!`,true);
   }
   huntState.targetX=st.x;
   huntState.targetY=st.y;
   huntState.lastAutoStation=-1;
   return;
  }
  if(action==='clickChest'){
   const m=world?.current;if(!m)return;
   if(m.round<3){
    const st=m.huntMap?.stations?.[m.round];
    if(st){huntState.targetX=st.x;huntState.targetY=st.y;}
    return notice('🧰 Rương đang khóa','Hãy đánh bại đủ 3 Trạm Quái Vật (I, II, III) trên bản đồ để mở Rương Mật Mã của chặng!',false);
   }
   return;
  }
  if(action==='openHuntBattle'){
   const m=world?.current;if(!m)return;
   const st=m.huntMap?.stations?.[m.round];
   if(st){huntState.x=st.x;huntState.y=st.y;huntState.targetX=null;huntState.targetY=null;}
   huntState.battleOpen=true;
   huntState.selectedChoice=null;
   huntState.shortText='';
   huntState.monsterDefeated=false;
   huntState.rewardBadge=null;
   render();
   return;
  }
  if(action==='closeHuntBattle'){
   huntState.battleOpen=false;
   render();
   return;
  }
  if(action==='selectHuntOpt'){
   huntState.selectedChoice=Number(el.dataset.choice);
   $$('.hw-opt-btn').forEach((b,i)=>b.classList.toggle('selected',i===huntState.selectedChoice));
   return;
  }
  if(action==='attackHuntMonster'){
   const shortVal=$('#huntShortInput')?.value?.trim()||'';
   huntState.shortText=shortVal;
   if(shortVal!==''){
    await submitStageAnswer({shortText:shortVal});
    return;
   }
   if(huntState.selectedChoice===null){
    return notice('Chưa chọn đòn tấn công','Hãy chọn một đáp án A, B, C, D hoặc nhập kết quả vào ô trống trước khi bấm Tấn công!',false);
   }
   await submitStageAnswer({choice:huntState.selectedChoice});
   return;
  }
  if(action==='finishHuntReward'){
   huntState.battleOpen=false;
   huntState.monsterDefeated=false;
   huntState.rewardBadge=null;
   huntState.selectedChoice=null;
   huntState.shortText='';
   await refresh(true);
   // Tự động hướng nhân vật về phía trạm tiếp theo
   const m=world?.current;
   const nextSt=m?.huntMap?.stations?.[m.round];
   if(nextSt){huntState.targetX=nextSt.x;huntState.targetY=nextSt.y;}
   return;
  }

  /* ─── ACTIONS CHO BẢO VỆ THÀNH TRÌ ─── */
  if(action==='answer'){
   await submitStageAnswer({choice:Number(el.dataset.choice)});
   return;
  }
  if(action==='submitShortCastle'){
   const val=$('#cdShortInput')?.value?.trim()||'';
   if(!val)return notice('Chưa nhập đáp án','Hãy nhập kết quả tính toán vào ô trống hoặc chọn đáp án A, B, C, D!',false);
   await submitStageAnswer({shortText:val});
   return;
  }
  if(action==='buyUpgrade'){
   const key=el.dataset.upgrade;
   const r=await submit('/api/upgrade',{upgrade:key});
   if(r.ok){
    world.me.gold=r.gold;
    world.me.upgrades=r.upgrades;
    world.me.health=r.health;
    cdState.castleMaxHp=260+(r.upgrades.hp||1)*40;
    cdState.castleHp=Math.min(cdState.castleMaxHp,cdState.castleHp+45);
    sound(true);
    render();
   }
   return;
  }
  if(action==='useSkill'){
   const sk=el.dataset.skill;
   const now=performance.now();
   if((cdState.skillCd[sk]||0)>now)return;
   sound(true);
   if(sk==='arrowRain'){
    cdState.skillCd.arrowRain=now+12000;
    for(let i=0;i<9;i++){
     cdState.projectiles.push({id:++cdState.seq,lane:i%3,x:18+(i*6),speed:55,dmg:45,icon:'🏹'});
    }
    cdState.effects.push({id:++cdState.seq,x:55,lane:1,text:'🌧️ MƯA TÊN VECTƠ!',cls:'crit',until:now+900});
   }else if(sk==='iceVolley'){
    cdState.skillCd.iceVolley=now+14000;
    cdState.slowUntil=now+6000;
    cdState.effects.push({id:++cdState.seq,x:55,lane:1,text:'❄️ ĐÓNG BĂNG QUÁI 6 GIÂY!',cls:'crit',until:now+950});
   }else if(sk==='groupHeal'){
    cdState.skillCd.groupHeal=now+15000;
    cdState.castleHp=Math.min(cdState.castleMaxHp,cdState.castleHp+90);
    cdState.effects.push({id:++cdState.seq,x:20,lane:1,text:'💚 +90 HP THÀNH TRÌ!',cls:'crit',until:now+950});
   }else if(sk==='castleShield'){
    cdState.skillCd.castleShield=now+16000;
    cdState.shieldUntil=now+7000;
    cdState.effects.push({id:++cdState.seq,x:18,lane:1,text:'🛡️ BẬT KHIÊN BẤT TỬ 7 GIÂY!',cls:'crit',until:now+950});
   }
   render();
   return;
  }

  /* ─── ACTIONS CHUNG ─── */
  if(action==='hint'){
   if(world.paused)return notice('Tạm dừng','Giáo viên đang tạm dừng nhiệm vụ.',false);
   const result=await submit('/api/hint',{stage:world.me.stage,round:world.me.round});
   notice('💡 GỢI Ý TỪ TRỢ LÝ NOVA',result.hint+' ('+result.cost+')',false,{button:'Quay lại nhiệm vụ'});
   return;
  }
  if(action==='final'){
   const code=$('#finalCode').value.trim();
   const selected=$('input[name="message"]:checked');
   if(!selected)return notice('Thiếu thông điệp','Hãy chọn một trong ba thông điệp từ mật mã.',false);
   const r=await submit('/api/final',{code,choice:Number(selected.value)});
   if(r.correct)notice('🏆 GIẢI CỨU THÀNH PHỐ OXYZ THÀNH CÔNG!','Lõi Trí Tuệ đã được khôi phục: '+r.message,true,{points:r.points,button:'Xem bảng vinh danh →'});
   else notice('MẬT THƯ CHƯA ĐƯỢC MỞ','NOVA gợi ý: '+r.hint,false,{button:'Thử giải mã lại'});
   updateAfterAction();return;
  }
  if(action==='closeModal'){modal=null;$('.modal-backdrop')?.remove();await refresh(true);return;}
  if(action==='pauseGame'){await submit('/api/teacher',{action:'pause'});updateAfterAction();return;}
  if(action==='timerToggle'){await submit('/api/teacher',{action:'timer',value:world.clock.running?'pause':'start'});updateAfterAction();return;}
  if(action==='timerReset'){await submit('/api/teacher',{action:'timer',value:'reset'});updateAfterAction();return;}
  if(action==='setBonus'){const team=$('#bonusTeam').value,value=Number($('#bonusValue').value);await submit('/api/teacher',{action:'bonus',team,value});updateAfterAction();return;}
  if(action==='awards'){showAward=!showAward;render();return;}
  if(action==='print'){window.print();return;}
  if(action==='exportCSV'){exportCSV();return;}
  if(action==='resetTeam'){const team=$('#resetTeam').value;const name=world.teams.find(t=>t.id===team)?.name;if(!confirm('Đặt lại từ đầu toàn bộ nhiệm vụ và điểm của '+name+'?'))return;await submit('/api/teacher',{action:'resetTeam',team});updateAfterAction();return;}
  if(action==='copy'){const url=el.dataset.url;try{await navigator.clipboard.writeText(url);notice('ĐÃ SAO CHÉP LIÊN KẾT',url,true);}catch(e){notice('LIÊN KẾT ĐỘI',url,true);}return;}
 }catch(e){
  notice('THÔNG BÁO',e.message||'Có lỗi xảy ra.',false);
  if(el)el.disabled=false;
 }
}

/* ─── XỬ LÝ SỰ KIỆN BÀN PHÍM, CHUỘT & D-PAD CHO BẢN ĐỒ 2D ─── */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');
 if(el){e.preventDefault();handle(el.dataset.action,el);return;}
 // Click trực tiếp lên bản đồ Săn Kho Báu để di chuyển nhân vật
 const vp=e.target.closest('#hwViewport');
 if(vp&&!e.target.closest('.hw-controls-overlay')&&!e.target.closest('.hw-station')&&!e.target.closest('.hw-chest')){
  const wd=$('#hwWorld');if(!wd)return;
  const rect=wd.getBoundingClientRect();
  if(rect.width>0&&rect.height>0){
   const tx=Math.max(6,Math.min(94,(e.clientX-rect.left)/rect.width*100));
   const ty=Math.max(8,Math.min(92,(e.clientY-rect.top)/rect.height*100));
   huntState.targetX=tx;
   huntState.targetY=ty;
   huntState.lastAutoStation=-1;
   const rip=document.createElement('div');
   rip.className='hw-ripple';
   rip.style.left=tx+'%';rip.style.top=ty+'%';
   wd.appendChild(rip);
   setTimeout(()=>rip.remove(),550);
  }
 }
});

document.addEventListener('pointerdown',e=>{
 const dbtn=e.target.closest('[data-dpad]');
 if(dbtn){
  e.preventDefault();
  huntState.keysPressed.add(dbtn.dataset.dpad);
  huntState.targetX=null;huntState.targetY=null;
 }
});
document.addEventListener('pointerup',()=>{
 ['up','down','left','right'].forEach(k=>huntState.keysPressed.delete(k));
});

const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'};
window.addEventListener('keydown',e=>{
 if(document.activeElement?.matches('input,select,textarea')){
  if(e.key==='Enter'){
   if(document.activeElement.id==='huntShortInput')handle('attackHuntMonster');
   else if(document.activeElement.id==='cdShortInput')handle('submitShortCastle');
   else if(!session)$('#entry [data-action="join"]')?.click();
  }
  return;
 }
 const dir=keyMap[e.code];
 if(dir&&session?.role==='student'&&!huntState.battleOpen){
  e.preventDefault();
  huntState.keysPressed.add(dir);
  huntState.targetX=null;huntState.targetY=null;
 }
});
window.addEventListener('keyup',e=>{
 const dir=keyMap[e.code];
 if(dir)huntState.keysPressed.delete(dir);
});

document.addEventListener('change',e=>{
 if(e.target.id==='clockMinutes'&&session?.role==='teacher'){
  submit('/api/teacher',{action:'timer',value:Number(e.target.value)}).then(updateAfterAction).catch(err=>notice('Lỗi đồng hồ',err.message,false));
 }
});

/* ─── VÒNG LẶP GAME 60FPS CHO CẢ 2 ENGINE (HUNT 2D & CASTLE DEFENSE) ─── */
let lastFrameTs=performance.now();
function gameLoop(now){
 const dt=Math.min(0.08,(now-lastFrameTs)/1000);
 lastFrameTs=now;

 if(session?.role==='student'&&world?.current&&!world.paused&&!world.me?.completed&&world.me?.stage<5){
  const m=world.current;
  const mode=activePlayMode||m.defaultMode||(m.id===2||m.id===5?'defense':'hunt');

  if(mode==='hunt'&&!huntState.battleOpen&&$('#hwViewport')){
   let vx=0,vy=0;
   if(huntState.keysPressed.has('left'))vx-=1;
   if(huntState.keysPressed.has('right'))vx+=1;
   if(huntState.keysPressed.has('up'))vy-=1;
   if(huntState.keysPressed.has('down'))vy+=1;

   if(vx!==0||vy!==0){
    const len=Math.hypot(vx,vy);
    huntState.x=Math.max(6,Math.min(94,huntState.x+(vx/len)*24*dt));
    huntState.y=Math.max(8,Math.min(92,huntState.y+(vy/len)*24*dt));
    huntState.moving=true;
   }else if(huntState.targetX!==null&&huntState.targetY!==null){
    const dx=huntState.targetX-huntState.x, dy=huntState.targetY-huntState.y;
    const dist=Math.hypot(dx,dy);
    if(dist<0.8){
     huntState.x=huntState.targetX;huntState.y=huntState.targetY;
     huntState.targetX=null;huntState.targetY=null;
     huntState.moving=false;
    }else{
     huntState.x+=(dx/dist)*28*dt;
     huntState.y+=(dy/dist)*28*dt;
     huntState.moving=true;
    }
   }else{
    huntState.moving=false;
   }
   updateHuntCamera();

   // Kiểm tra nếu nhân vật vừa chạm vào Trạm đang mở -> tự động bật Cuộn Giấy Chiến Đấu
   const curSt=m.huntMap?.stations?.[m.round];
   if(curSt){
    const dSt=Math.hypot(huntState.x-curSt.x,huntState.y-curSt.y);
    if(dSt<=4.2&&huntState.lastAutoStation!==m.round){
     huntState.lastAutoStation=m.round;
     huntState.targetX=null;huntState.targetY=null;huntState.moving=false;
     huntState.battleOpen=true;
     huntState.selectedChoice=null;
     huntState.shortText='';
     huntState.monsterDefeated=false;
     huntState.rewardBadge=null;
     render();
    }else if(dSt>7){
     huntState.lastAutoStation=-1;
    }
   }
  }

  if(mode==='defense'&&$('#cdBattlefield')){
   const up=world.me.upgrades||{damage:1,speed:1,hp:1,regen:1};
   // Hồi máu Thành Trì định kỳ
   if(now-cdState.lastRegenAt>1000){
    cdState.lastRegenAt=now;
    cdState.castleHp=Math.min(cdState.castleMaxHp,cdState.castleHp+(up.regen||1)*2);
   }
   // Sinh thêm quái vật nếu chiến trường vắng
   if(cdState.enemies.length<4&&now-cdState.lastSpawnAt>3200){
    cdState.lastSpawnAt=now;
    const kinds=['👺','🦇','💀','👹'];
    const lane=Math.floor(Math.random()*3);
    const hp=70+m.id*18+m.round*15;
    cdState.enemies.push({
     id:'en-'+(++cdState.seq),
     lane, x:92,
     hp, maxHp:hp,
     speed:2.0+Math.random()*0.7,
     sprite:kinds[(m.round+lane)%kinds.length],
     isBoss:false
    });
   }
   // Di chuyển Quái vật
   const slowed=cdState.slowUntil>now;
   const shieldOn=cdState.shieldUntil>now;
   for(let i=cdState.enemies.length-1;i>=0;i--){
    const en=cdState.enemies[i];
    en.x-=en.speed*(slowed?0.35:1)*dt;
    if(en.x<=15){
     const dmg=shieldOn?0:(en.isBoss?22:12);
     cdState.castleHp=Math.max(25,cdState.castleHp-dmg);
     cdState.effects.push({
      id:++cdState.seq,x:15,lane:en.lane,
      text:shieldOn?'🛡️ KHIÊN CHẶN!':`-${dmg} HP`,
      cls:'hit-castle',until:now+700
     });
     if(en.isBoss){
      en.x=78; // Boss lùi lại tiếp tục áp sát cho tới khi học sinh giải đúng toán
     }else{
      cdState.enemies.splice(i,1);
     }
    }
   }
   // 3 Anh Hùng tự động bắn đạn trên 3 làn
   const fireInterval=Math.max(450,1350-(up.speed||1)*180);
   const heroIcons=['🏹','🔮','⚡'];
   for(let lane=0;lane<3;lane++){
    if(now-cdState.lastHeroShot[lane]>=fireInterval){
     const hasTarget=cdState.enemies.some(e=>e.lane===lane&&e.x>16);
     if(hasTarget){
      cdState.lastHeroShot[lane]=now;
      cdState.projectiles.push({
       id:++cdState.seq,lane,x:17,
       speed:46,
       dmg:20+(up.damage||1)*9,
       icon:heroIcons[lane]
      });
     }
    }
   }
   // Di chuyển Đạn & Tính va chạm
   for(let i=cdState.projectiles.length-1;i>=0;i--){
    const p=cdState.projectiles[i];
    p.x+=p.speed*dt;
    const hitIdx=cdState.enemies.findIndex(e=>e.lane===p.lane&&Math.abs(e.x-p.x)<=3.5);
    if(hitIdx!==-1){
     const target=cdState.enemies[hitIdx];
     target.hp-=p.dmg;
     cdState.effects.push({id:++cdState.seq,x:target.x,lane:target.lane,text:`-${p.dmg}`,cls:'',until:now+550});
     cdState.projectiles.splice(i,1);
     if(target.hp<=0){
      if(target.isBoss){
       target.hp=Math.round(target.maxHp*0.35); // Boss chỉ bị tiêu diệt hoàn toàn khi học sinh giải đúng câu hỏi Toán!
       cdState.effects.push({id:++cdState.seq,x:target.x,lane:target.lane,text:'🎯 GIẢI TOÁN ĐỂ KẾT LIỄU BOSS!',cls:'crit',until:now+900});
      }else{
       cdState.enemies.splice(hitIdx,1);
       world.me.gold=(world.me.gold||100)+5;
      }
     }
    }else if(p.x>98){
     cdState.projectiles.splice(i,1);
    }
   }
   cdState.effects=cdState.effects.filter(fx=>fx.until>now);
   renderCastleDynamicNodes(now);
  }
 }
 requestAnimationFrame(gameLoop);
}

function renderCastleDynamicNodes(now){
 const layer=$('#cdDynamicLayer');if(!layer)return;
 const laneTops=[43,64,85];
 const slowed=cdState.slowUntil>now;
 const shieldEl=$('#cdCastleShield');
 if(shieldEl)shieldEl.style.display=cdState.shieldUntil>now?'block':'none';
 const hpEl=$('#cdHudHp'), hpBar=$('#cdHudHpBar'), goldEl=$('#cdHudGold'), topGold=$('#topGoldBadge');
 if(hpEl)hpEl.textContent=`${Math.round(cdState.castleHp)} / ${cdState.castleMaxHp}`;
 if(hpBar)hpBar.style.width=`${Math.max(0,Math.min(100,Math.round(cdState.castleHp/cdState.castleMaxHp*100)))}%`;
 if(goldEl&&world?.me)goldEl.textContent=`${world.me.gold??100} Vàng`;
 if(topGold&&world?.me)topGold.textContent=world.me.gold??100;

 const enemiesHtml=cdState.enemies.map(en=>`<div class="cd-enemy ${en.isBoss?'is-boss':''} ${slowed?'is-slowed':''}" style="left:${en.x.toFixed(1)}%;top:${laneTops[en.lane]}%">
  <div class="cd-enemy-hp"><i style="width:${Math.max(0,Math.round(en.hp/en.maxHp*100))}%"></i></div>
  <div class="cd-enemy-sprite">${en.sprite}</div>
 </div>`).join('');

 const projHtml=cdState.projectiles.map(p=>`<div class="cd-proj" style="left:${p.x.toFixed(1)}%;top:${laneTops[p.lane]}%">${p.icon}</div>`).join('');
 const fxHtml=cdState.effects.map(fx=>`<div class="cd-fx ${fx.cls||''}" style="left:${fx.x.toFixed(1)}%;top:${laneTops[fx.lane]-6}%">${esc(fx.text)}</div>`).join('');
 layer.innerHTML=enemiesHtml+projHtml+fxHtml;
}

function awardScreen(){
 if(!world||world.role!=='teacher')return '';
 const ts=[...world.teams].sort((a,b)=>b.score-a.score||((a.finishedAt||'9999').localeCompare(b.finishedAt||'9999')));
 const finished=ts.filter(t=>t.completed).length;
 const bestCoop=[...ts].sort((a,b)=>b.bonus-a.bonus)[0];
 return `<div class="award-backdrop"><div class="award-panel">
 <div class="stars">✦ ✧ ★ ✦ ★</div><div class="eyebrow">MATHVERSE OXYZ • LỄ VINH DANH</div>
 <h1>${finished>0?'GIẢI CỨU THÀNH PHỐ OXYZ THÀNH CÔNG!':'BẢNG XẾP HẠNG TẠM THỜI'}</h1>
 <p>${finished>0?'Lõi Trí Tuệ đã được khôi phục. Xin chúc mừng các biệt đội Toán học!':'Các đội đang nỗ lực vượt qua 5 chặng thử thách!'}</p>
 <div class="podium">${ts.slice(0,3).map((t,i)=>`<div class="podium-item ${i===0?'gold-podium':''}">
 <div style="font-size:35px">${i===0?'🥇':i===1?'🥈':'🥉'}</div><div class="podium-avatar">${t.avatar}</div>
 <b>${esc(t.name)}</b><strong>${t.score} XP</strong><small>${t.completed?'🔓 Mở kho báu':'Chặng '+t.stage+'/5'}</small></div>`).join('')}</div>
 <div class="winner-bottom">🤝 Giải hợp tác: <b>${bestCoop.bonus>0?esc(bestCoop.name):'Giáo viên công bố'}</b> · 🔐 Đã giải mã: <b>${finished} đội</b></div>
 <div class="controls" style="justify-content:center">${btn('⬅ Quay về màn hình giáo viên','awards','gray')}${btn('📥 Tải bảng điểm CSV','exportCSV','gold')}</div>
 </div></div>`;
}

function exportCSV(){
 const columns=['Thứ hạng','Tên đội','Nhân vật','Số trạm qua','Lượt trong trạm','Số câu sai','Số khiên còn','Vàng tích lũy','Cấp Anh Hùng','Điểm nhiệm vụ','Điểm hợp tác','Tổng XP','Đã giải mã','Thời điểm hoàn thành'];
 const ordered=[...world.teams].sort((a,b)=>b.score-a.score||((a.finishedAt||'9999').localeCompare(b.finishedAt||'9999')));
 const rows=ordered.map((t,i)=>[i+1,t.name,t.avatar,t.stage,t.round,t.wrong,t.health,t.gold??100,t.heroLevel??1,t.score-t.bonus,t.bonus,t.score,t.completed?'Có':'Chưa',t.finishedAt?new Date(t.finishedAt).toLocaleString('vi-VN'):'']);
 const quote=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const csv='\ufeff'+[columns,...rows].map(r=>r.map(quote).join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
 const link=URL.createObjectURL(blob);const a=document.createElement('a');a.href=link;a.download='MATHVERSE_OXYZ_KET_QUA_'+world.room+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(link),1500);
}

session=restoreSession();
if(session){refresh(true);}else{startScreen();}
setInterval(()=>{if(session&&!document.hidden)refresh(false);},2500);
setInterval(updateClock,400);
requestAnimationFrame(gameLoop);

</script>

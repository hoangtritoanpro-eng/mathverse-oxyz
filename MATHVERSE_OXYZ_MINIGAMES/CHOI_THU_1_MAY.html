/* ═══ BẢN ĐỒ LỤC ĐỊA 5 CHẶNG HÀNH TRÌNH OXYZ (WORLD JOURNEY ISLANDS) ═══ */
.world-journey-map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:14px 0 8px;position:relative;padding:6px 2px}
.world-journey-map:before{content:'';position:absolute;left:8%;right:8%;top:42px;height:6px;background:linear-gradient(90deg,#10b981,#3b82f6,#a855f7,#14b8a6,#ef4444);border-radius:99px;opacity:.45;z-index:0}
.island-card{position:relative;z-index:1;background:linear-gradient(160deg,#ffffff,#f4f7ff);border:2px solid #dbe4f6;border-radius:18px;padding:10px 10px 11px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:all .24s;cursor:pointer;box-shadow:0 6px 16px rgba(35,52,98,.07)}
.island-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(55,75,145,.15)}
.island-card.done{border-color:#10b981;background:linear-gradient(160deg,#ecfdf5,#d1fae5)}
.island-card.current{border-color:#7c3aed;background:linear-gradient(160deg,#f5f3ff,#ede9fe);box-shadow:0 0 0 3px rgba(124,58,237,.22),0 12px 26px rgba(109,40,217,.22);transform:translateY(-3px)}
.island-card.locked{opacity:.75;background:#f8fafc}
.island-orb{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 30% 30%,#fff,#e2e8f0);border:2.5px solid var(--biome,#3b82f6);box-shadow:0 6px 14px rgba(0,0,0,.1);margin-bottom:6px;position:relative}
.island-card.current .island-orb{animation:float 2.6s ease-in-out infinite;box-shadow:0 0 18px var(--biome,#7c3aed)}
.island-card.done .island-orb{border-color:#10b981;background:radial-gradient(circle at 30% 30%,#d1fae5,#6ee7b7)}
.island-badge{position:absolute;top:-6px;right:-8px;background:#1e293b;color:#facc15;font-size:10px;font-weight:950;padding:2px 6px;border-radius:99px;border:1.5px solid #facc15}
.island-stars{font-size:11px;letter-spacing:1px;margin:2px 0;color:#f59e0b}
.island-title{font-size:12px;font-weight:900;color:#1e293b;line-height:1.25}
.island-sub{font-size:10px;font-weight:800;color:#64748b;margin-top:2px}

.island-card.done .island-mode-tag{background:#059669;color:#fff}
.island-card.current .island-mode-tag{background:#6d28d9;color:#fff}

/* ═══ MÔ PHỎNG HÌNH HỌC KHÔNG GIAN 3D OXYZ HOLOGRAM (3D VISUALIZER) ═══ */
.oxyz-hologram-box{background:radial-gradient(circle at 50% 45%,#172554 0%,#090d1e 90%);border:2px solid #38bdf8;border-radius:18px;padding:12px 14px;color:#e0f2fe;box-shadow:inset 0 0 28px rgba(56,189,248,.22),0 10px 24px rgba(9,13,30,.25);position:relative;overflow:hidden}
.oxyz-hologram-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.oxyz-hologram-title{font-size:12px;font-weight:950;letter-spacing:.06em;color:#7dd3fc;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.oxyz-controls{display:flex;gap:5px;flex-wrap:wrap}
.oxyz-btn{border:1px solid rgba(125,211,252,.45);background:rgba(15,23,42,.85);color:#bae6fd;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:850}
.oxyz-btn:hover{background:#0284c7;color:#fff}
.oxyz-canvas-wrap{display:grid;grid-template-columns:1fr 220px;gap:12px;align-items:center}
.oxyz-svg{width:100%;height:195px;background:repeating-linear-gradient(0deg,rgba(56,189,248,.05) 0 1px,transparent 1px 20px),repeating-linear-gradient(90deg,rgba(56,189,248,.05) 0 1px,transparent 1px 20px);border-radius:12px;border:1px solid rgba(56,189,248,.25)}
.oxyz-formula-card{background:rgba(15,23,42,.86);border:1.5px solid rgba(250,204,21,.45);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.45}
.oxyz-formula-card b{color:#fde047;display:block;margin-bottom:4px;font-size:12.5px}
.oxyz-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;font-weight:800}
.oxyz-legend span{display:inline-flex;align-items:center;gap:4px}
.oxyz-dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* Thanh 3D Oxyz thu gọn tiện ích */
.oxyz-compact-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(90deg,#090f1d,#0c1a30);border:1.5px solid #1e3a5f;border-radius:14px;margin-top:12px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.oxyz-compact-tag{background:#0284c7;color:#fff;font-size:10.5px;font-weight:950;padding:2px 8px;border-radius:6px;letter-spacing:.05em}
.oxyz-toggle-btn{border:1.5px solid #38bdf8;background:linear-gradient(135deg,#0c4a6e,#0284c7);color:#fff;font-size:12px;font-weight:900;padding:6px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(2,132,199,.4);transition:all .15s}
.oxyz-toggle-btn:hover{background:#0369a1;transform:scale(1.04)}

/* ═══ SÂN KHẤU TRAO GIẢI ═══ */
.award-backdrop{position:fixed;inset:0;background:#12143fe8;z-index:75;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:25px;backdrop-filter:blur(8px)}.award-panel{width:min(920px,100%);background:linear-gradient(143deg,#312e89 0%,#593bc0 60%,#167fb0 100%);border:2px solid #ffffff40;color:white;box-shadow:0 35px 95px #0008;border-radius:30px;padding:34px;text-align:center;position:relative;overflow:hidden}.award-panel>*{position:relative;z-index:1}.award-panel h1{font-size:clamp(25px,3.4vw,41px);margin:10px auto;max-width:830px}.award-panel p{color:#e5e0ff;font-size:15px}.stars{font-size:40px;color:#ffdc71;letter-spacing:13px;animation:float 3s infinite}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:27px auto;max-width:780px}.podium-item{padding:23px 9px 20px;border-radius:22px;border:1px solid #ffffff5e;background:#ffffff1e;display:flex;align-items:center;flex-direction:column;gap:6px}.podium-item.gold-podium{background:linear-gradient(150deg,#ffcc5899,#fff4b43b);border:2px solid #ffd56d;box-shadow:0 0 35px #ffdf5a2b}.podium-avatar{font-size:61px;filter:drop-shadow(0 9px 8px #12132d8c);animation:float 4s infinite}.podium-item b{font-size:18px}.podium-item strong{font-size:24px;color:#ffe785}.podium-item small{color:#d2e0ff}.winner-bottom{margin:13px auto 23px;padding:12px;background:#ffffff12;border:1px solid #ffffff38;border-radius:12px;color:#ecf5ff}.award-panel .button.gray{background:#ffffff;color:#493b98}

.mode-btn{border:0;background:transparent;color:#94a3b8;padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:850;display:inline-flex;align-items:center;gap:6px}
.mode-btn.active{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;box-shadow:0 3px 12px rgba(245,158,11,.4)}
.combo-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;font-size:12px;font-weight:950;box-shadow:0 0 14px rgba(239,68,68,.55);animation:pulse 1.2s infinite}
.role-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 18px;background:#f4f7ff;border-bottom:1px solid #dde6f7}
.role-chip{background:#fff;border:1px solid #d5e0f5;border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:750;color:#2c3e6b;line-height:1.35;box-shadow:0 2px 5px rgba(30,50,100,.04)}
.role-chip.active-role{border-color:#f59e0b;background:linear-gradient(135deg,#fffbeb,#fef3c7);color:#92400e;box-shadow:0 0 0 2px rgba(245,158,11,.2)}

/* ═══════════════════════════════════════════════════════════════════════════
   ENGINE 1: SĂN KHO BÁU 2D MAP (AAA SCAVENGER HUNT RPG)
   ═══════════════════════════════════════════════════════════════════════════ */
.hw-wrapper{background:#0b1320;color:#fff;padding:14px;position:relative;user-select:none}
.hw-hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;background:rgba(15,23,42,.92);border:1.5px solid rgba(200,169,110,.6);border-radius:14px;padding:10px 14px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.hw-hud-keys{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hw-key-slot{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;background:#1e293b;border:2px solid #475569;color:#94a3b8;font-weight:900;font-size:13px;transition:all .25s}
.hw-key-slot.earned{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#f59e0b;color:#78350f;box-shadow:0 0 14px rgba(245,158,11,.45)}
.hw-key-slot.current{border-color:#38bdf8;color:#e0f2fe;background:#0f2942;animation:pulse 1.5s infinite}
.hw-quick-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hw-tracker-pill{padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:850;display:inline-flex;align-items:center;gap:5px;background:rgba(15,23,42,.85);border:1.5px solid #475569;color:#cbd5e1}
.hw-tracker-pill.active{border-color:#38bdf8;background:linear-gradient(135deg,#0c4a6e,#0369a1);color:#f0f9ff;box-shadow:0 0 14px rgba(56,189,248,.45);animation:pulse 1.4s infinite}
.hw-tracker-pill.done{border-color:#10b981;background:#064e3b;color:#a7f3d0}

.hw-exploring-pill{display:flex;align-items:center;gap:10px;background:rgba(15,23,42,.92);border:1.5px solid #facc15;border-radius:14px;padding:8px 14px;box-shadow:0 8px 20px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.hw-exploring-icon{font-size:22px;animation:spinSlow 8s linear infinite}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.hw-quick-btn{border:1.5px solid #c8a96e;background:linear-gradient(135deg,#3b2d1d,#251b10);color:#fde68a;border-radius:9px;padding:6px 11px;font-size:12px;font-weight:850;display:inline-flex;align-items:center;gap:5px}
.hw-quick-btn.done{border-color:#10b981;background:#064e3b;color:#a7f3d0}
.hw-quick-btn.active{border-color:#38bdf8;background:#0c4a6e;color:#bae6fd;box-shadow:0 0 12px rgba(56,189,248,.4)}

.hw-viewport{position:relative;width:100%;height:485px;border-radius:18px;overflow:hidden;border:3px solid #c8a96e;box-shadow:inset 0 0 50px rgba(0,0,0,.75),0 14px 32px rgba(0,0,0,.45);background:#122416;cursor:crosshair;touch-action:none}
.hw-world{position:absolute;left:0;top:0;width:1200px;height:820px;transform-origin:0 0;transition:transform 60ms linear;will-change:transform}
.hw-world.theme-forest{background:
  radial-gradient(circle at 34% 26%,rgba(255,235,140,.25) 0,transparent 18%),
  radial-gradient(circle at 54% 74%,rgba(80,220,255,.22) 0,transparent 18%),
  radial-gradient(circle at 72% 30%,rgba(255,180,100,.24) 0,transparent 18%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 40px),
  linear-gradient(135deg,#143617 0%,#235728 35%,#1c4621 68%,#102913 100%)}
.hw-world.theme-fortress{background:
  radial-gradient(circle at 35% 28%,rgba(140,180,255,.24) 0,transparent 18%),
  radial-gradient(circle at 56% 72%,rgba(255,130,130,.22) 0,transparent 18%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 44px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 44px),
  linear-gradient(135deg,#1e293b 0%,#334155 48%,#0f172a 100%)}
.hw-world.theme-crystal{background:
  radial-gradient(circle at 32% 30%,rgba(56,189,248,.3) 0,transparent 18%),
  radial-gradient(circle at 52% 70%,rgba(192,132,252,.3) 0,transparent 18%),
  radial-gradient(circle at 73% 34%,rgba(250,204,21,.26) 0,transparent 18%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 40px),
  linear-gradient(135deg,#17153b 0%,#2e236c 45%,#433d8b 100%)}
.hw-world.theme-maze{background:
  radial-gradient(circle at 50% 50%,rgba(45,212,191,.22) 0,transparent 45%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 36px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 36px),
  linear-gradient(135deg,#042f2e 0%,#115e59 52%,#082f49 100%)}
.hw-world.theme-citadel{background:
  radial-gradient(circle at 34% 28%,rgba(244,63,94,.28) 0,transparent 18%),
  radial-gradient(circle at 56% 72%,rgba(249,115,22,.28) 0,transparent 18%),
  radial-gradient(circle at 75% 34%,rgba(168,85,247,.32) 0,transparent 20%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 40px),
  linear-gradient(135deg,#2a081c 0%,#4a1230 48%,#190a28 100%)}

/* Mini-Map Radar góc trên phải Viewport */
.hw-minimap{position:absolute;top:12px;right:12px;width:158px;height:110px;background:rgba(9,14,26,.88);border:2px solid #c8a96e;border-radius:12px;z-index:26;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.6);pointer-events:none;backdrop-filter:blur(4px)}
.hw-minimap-title{position:absolute;top:3px;left:7px;font-size:9px;font-weight:950;color:#fde68a;letter-spacing:.08em;text-transform:uppercase;z-index:2}
.hw-minimap-dot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%)}
.hw-minimap-dot.st-done{background:#10b981;box-shadow:0 0 6px #10b981}
.hw-minimap-dot.st-active{background:#facc15;box-shadow:0 0 8px #facc15;animation:pulse 1.2s infinite}
.hw-minimap-dot.st-lock{background:#64748b}
.hw-minimap-dot.chest{background:#f97316;width:9px;height:9px;border-radius:2px}
.hw-minimap-player{position:absolute;width:10px;height:10px;border-radius:50%;background:#38bdf8;border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 8px #38bdf8;z-index:3}

/* Mũi tên La Bàn chỉ hướng tới Trạm đang mở */
.hw-compass{position:absolute;top:12px;left:12px;background:rgba(9,14,26,.88);border:1.5px solid #38bdf8;border-radius:12px;padding:7px 12px;z-index:26;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:850;color:#e0f2fe;box-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none}
.hw-compass-arrow{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#0284c7;color:#fde047;font-size:15px;font-weight:950;transition:transform 80ms linear}

/* Đường mòn & vật cản trang trí trên bản đồ 2D */
.hw-path-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hw-river-flow{animation:riverFlow 4s linear infinite}
@keyframes riverFlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-120}}

/* Cảnh quan cây cối & Bia đá tọa độ Oxyz */
.hw-nature-tree{position:absolute;transform:translate(-50%,-80%);pointer-events:none;z-index:4;display:flex;flex-direction:column;align-items:center}
.hw-tree-shadow{position:absolute;bottom:4px;width:44px;height:18px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px)}
.hw-tree-crown{font-size:42px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));transform-origin:bottom center;animation:treeSway 4s ease-in-out infinite alternate}
.hw-tree-crown.pine{font-size:46px;animation-delay:1.2s}
.hw-tree-crown.palm{font-size:40px;animation-delay:.6s}
@keyframes treeSway{0%{transform:rotate(0deg)}50%{transform:rotate(2.5deg)}100%{transform:rotate(-2deg)}}

.hw-monument{position:absolute;transform:translate(-50%,-50%);z-index:3;width:34px;height:52px;background:linear-gradient(180deg,#64748b,#334155);border:2px solid #94a3b8;border-radius:6px 6px 2px 2px;box-shadow:0 8px 14px rgba(0,0,0,.5);display:grid;place-items:center;cursor:help}
.hw-monument-rune{font-family:'Courier New',monospace;font-size:13px;font-weight:950;color:#38bdf8;text-shadow:0 0 8px #38bdf8;letter-spacing:1px}

.hw-obstacle{position:absolute;transform:translate(-50%,-50%);font-size:30px;pointer-events:none;z-index:3;filter:drop-shadow(0 5px 5px rgba(0,0,0,.5));user-select:none}
.hw-wall-block{position:absolute;background:linear-gradient(180deg,#475569,#1e293b);border:2px solid #94a3b8;border-radius:8px;box-shadow:0 6px 0 #0f172a,0 8px 14px rgba(0,0,0,.45);z-index:3;pointer-events:none}
.theme-maze .hw-wall-block{background:linear-gradient(180deg,#0d9488,#115e59);border-color:#5eead4;box-shadow:0 6px 0 #042f2e}
.theme-crystal .hw-wall-block{background:linear-gradient(180deg,#7c3aed,#4c1d95);border-color:#c4b5fd;box-shadow:0 6px 0 #2e1065}
.hw-firefly{position:absolute;width:6px;height:6px;border-radius:50%;background:#fde047;box-shadow:0 0 10px 3px rgba(253,224,71,.75);pointer-events:none;z-index:4;animation:float 3.2s ease-in-out infinite}
.hw-crystal-spire{position:absolute;transform:translate(-50%,-50%);font-size:34px;z-index:4;pointer-events:none;animation:float 2.8s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(168,85,247,.8))}

/* Đền Thờ / Trạm Thử Thách Oxyz Đồ Họa Cực Phẩm */
.hw-station{position:absolute;transform:translate(-50%,-50%);z-index:12;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.hw-station:hover{transform:translate(-50%,-50%) scale(1.08)}
.hw-shrine-base{position:absolute;width:88px;height:36px;border-radius:50%;background:linear-gradient(180deg,#334155,#0f172a);border:2px solid #64748b;top:60%;left:50%;transform:translate(-50%,-50%);box-shadow:0 10px 24px rgba(0,0,0,.7);pointer-events:none}
.hw-shrine-pillars{position:absolute;width:96px;height:48px;top:40%;left:50%;transform:translate(-50%,-50%);pointer-events:none;display:flex;justify-content:space-between}
.hw-pillar{width:10px;height:46px;background:linear-gradient(180deg,#94a3b8,#475569);border:1.5px solid #cbd5e1;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.6)}

.hw-beacon-beam{position:absolute;width:32px;height:240px;bottom:35px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,transparent,rgba(250,204,21,.15),rgba(250,204,21,.65));border-radius:99px;filter:blur(3px);pointer-events:none;animation:beaconPulse 1.8s infinite alternate}
@keyframes beaconPulse{0%{opacity:.55;transform:translateX(-50%) scaleX(.85)}100%{opacity:.95;transform:translateX(-50%) scaleX(1.15)}}

.hw-ring{position:absolute;width:124px;height:124px;border-radius:50%;border:3px dashed rgba(250,204,21,.88);background:radial-gradient(circle,rgba(250,204,21,.26) 0%,rgba(250,204,21,.02) 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:hwSpin 12s linear infinite;pointer-events:none}
.hw-station.locked .hw-ring{border-color:rgba(148,163,184,.35);background:radial-gradient(circle,rgba(148,163,184,.08) 0%,transparent 70%);animation:none}
.hw-station.passed .hw-ring{border-color:rgba(52,211,153,.85);background:radial-gradient(circle,rgba(52,211,153,.2) 0%,transparent 70%);animation:none}

.hw-station-core{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#334155,#0f172a);border:3.5px solid #facc15;display:grid;place-items:center;font-size:36px;box-shadow:0 10px 26px rgba(0,0,0,.7),0 0 20px rgba(250,204,21,.5);position:relative;z-index:2;animation:float 2.5s ease-in-out infinite}
.hw-station.locked .hw-station-core{border-color:#64748b;filter:grayscale(.8);opacity:.8;box-shadow:none;animation:none}
.hw-station.passed .hw-station-core{border-color:#10b981;background:radial-gradient(circle at 30% 30%,#065f46,#022c22);box-shadow:0 0 22px rgba(16,185,129,.5);animation:none}

.hw-cleared-badge{position:absolute;top:-4px;right:-4px;font-size:20px;background:#10b981;border:2px solid #fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.hw-station-info{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:6px;z-index:3}
.hw-station-label{padding:4px 12px;border-radius:99px;background:rgba(15,23,42,.94);border:1.5px solid #facc15;color:#fef08a;font-size:12px;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.55)}
.hw-station.passed .hw-station-label{border-color:#34d399;color:#a7f3d0}
.hw-station.locked .hw-station-label{border-color:#64748b;color:#cbd5e1}
.hw-station-action-hint{font-size:10px;font-weight:950;color:#fde047;background:rgba(180,83,9,.9);padding:2px 8px;border-radius:6px;animation:pulse 1.2s infinite}

/* Rương kho báu chặng */
.hw-chest{position:absolute;transform:translate(-50%,-50%);z-index:11;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s}
.hw-chest:hover{transform:translate(-50%,-50%) scale(1.08)}
.hw-chest-pedestal{position:absolute;width:82px;height:32px;border-radius:50%;background:#1e293b;border:2px solid #ca8a04;top:65%;left:50%;transform:translate(-50%,-50%);box-shadow:0 8px 20px rgba(0,0,0,.6)}
.hw-chest-box{width:74px;height:74px;border-radius:20px;background:radial-gradient(circle,#fef08a,#ca8a04);border:3.5px solid #fff;display:grid;place-items:center;font-size:38px;box-shadow:0 0 32px rgba(250,204,21,.85);position:relative;z-index:2;animation:float 2.4s ease-in-out infinite}
.hw-chest.locked .hw-chest-box{filter:grayscale(.75);opacity:.65;box-shadow:none;animation:none}

/* Tinh Thể & Quà Tặng Nhặt Trên Bản Đồ (Collectibles) */
.hw-collectible{position:absolute;transform:translate(-50%,-50%);z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:gemBob 2s ease-in-out infinite alternate}
@keyframes gemBob{0%{transform:translate(-50%,-50%) translateY(0)}100%{transform:translate(-50%,-50%) translateY(-9px)}}
.hw-collectible-icon{font-size:28px;filter:drop-shadow(0 0 10px rgba(250,204,21,.9))}
.hw-collectible.xp .hw-collectible-icon{filter:drop-shadow(0 0 12px #38bdf8)}
.hw-collectible.shield .hw-collectible-icon{filter:drop-shadow(0 0 12px #4ade80)}
.hw-collectible-tag{font-size:9.5px;font-weight:950;background:rgba(9,14,26,.88);padding:1px 6px;border-radius:6px;border:1px solid #facc15;color:#fde047;white-space:nowrap;margin-top:2px}
.hw-collectible.xp .hw-collectible-tag{border-color:#38bdf8;color:#bae6fd}
.hw-collectible.shield .hw-collectible-tag{border-color:#4ade80;color:#bbf7d0}

/* Chữ số nổi bay lên khi nhặt đồ (Popups) */
.hw-float-popup{position:absolute;transform:translate(-50%,-100%);z-index:28;font-size:16px;font-weight:950;text-shadow:0 2px 8px rgba(0,0,0,.9);pointer-events:none;animation:floatUpFade 1.2s ease-out forwards}
@keyframes floatUpFade{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}80%{opacity:1;transform:translate(-50%,-120%) scale(1)}100%{opacity:0;transform:translate(-50%,-150%) scale(.85)}}

/* Cọc Tiêu Định Vị Mục Tiêu khi chạm/click trên bản đồ */
.hw-target-beacon{position:absolute;transform:translate(-50%,-50%);z-index:18;pointer-events:none}
.hw-target-beacon-sonar{position:absolute;width:64px;height:64px;border-radius:50%;border:2.5px solid #38bdf8;top:50%;left:50%;transform:translate(-50%,-50%);animation:targetSonar 1s cubic-bezier(.25,1,.5,1) infinite}
@keyframes targetSonar{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
.hw-target-beacon-ring{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(56,189,248,.35);border:2px solid #bae6fd;top:50%;left:50%;transform:translate(-50%,-50%)}
.hw-target-beacon-pin{font-size:24px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));animation:pinBounce .5s infinite alternate ease-in-out;transform-origin:bottom center}
@keyframes pinBounce{0%{transform:translateY(0)}100%{transform:translateY(-8px)}}
.hw-target-beacon-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:rgba(9,14,26,.92);border:1px solid #38bdf8;color:#bae6fd;font-size:10px;font-weight:950;padding:2px 7px;border-radius:6px;white-space:nowrap}

/* NHÂN VẬT THÁM HIỂM (HERO CHARACTER) SỐNG ĐỘNG */
.hw-player{position:absolute;transform:translate(-50%,-50%);z-index:22;pointer-events:none;transition:left 50ms linear,top 50ms linear;display:flex;flex-direction:column;align-items:center}
.hw-player-torch{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,243,176,.35) 0%,rgba(56,189,248,.15) 45%,transparent 72%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hw-player-aura-ring{position:absolute;width:68px;height:68px;border-radius:50%;border:2px solid rgba(56,189,248,.8);box-shadow:0 0 16px rgba(56,189,248,.6);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pulse 1.6s infinite}
.hw-player-shadow{position:absolute;bottom:18px;width:44px;height:16px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px);transition:all .2s}

.hw-hero-chassis{position:relative;transition:transform .15s ease-out;display:grid;place-items:center}
.hw-player.facing-left .hw-hero-chassis{transform:scaleX(-1)}
.hw-player.facing-right .hw-hero-chassis{transform:scaleX(1)}
.hw-player.moving .hw-hero-chassis{animation:heroWalk .26s infinite alternate ease-in-out}
.hw-player.sprinting .hw-hero-chassis{animation:heroWalk .16s infinite alternate ease-in-out}
.hw-player.sprinting .hw-player-shadow{box-shadow:0 0 20px #f59e0b,0 0 35px #ef4444}
@keyframes heroWalk{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(-3deg)}100%{transform:translateY(0) rotate(3deg)}}

.hw-player-avatar{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff,#dbeafe);border:3.5px solid #38bdf8;box-shadow:0 0 22px rgba(56,189,248,.95),0 8px 16px rgba(0,0,0,.6);display:grid;place-items:center;font-size:32px;position:relative;z-index:2}
.hw-hero-crown{position:absolute;top:-12px;font-size:18px;animation:float 2s ease-in-out infinite;z-index:3}

.hw-player-tag{margin-top:4px;display:flex;flex-direction:column;align-items:center;gap:1px;z-index:3}
.hw-player-name{padding:2px 10px;border-radius:99px;background:#0284c7;color:#fff;font-size:11.5px;font-weight:950;white-space:nowrap;border:1.5px solid #bae6fd;box-shadow:0 3px 10px rgba(0,0,0,.55)}
.hw-player-role{font-size:9.5px;font-weight:900;background:rgba(15,23,42,.92);color:#fde047;padding:1px 7px;border-radius:99px;border:1px solid rgba(250,204,21,.5);white-space:nowrap}

/* D-Pad ảo & Nút Tăng Tốc Gamepad */
.hw-controls-overlay{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:25}
.hw-dpad-wrap{display:flex;flex-direction:column;gap:7px;pointer-events:auto}
.hw-dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:6px;background:rgba(15,23,42,.88);padding:8px;border-radius:18px;border:2px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);box-shadow:0 10px 28px rgba(0,0,0,.6)}
.hw-dpad button{width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(255,255,255,.32);background:linear-gradient(180deg,#334155,#1e293b);color:#f8fafc;font-size:19px;font-weight:950;display:grid;place-items:center;padding:0;box-shadow:0 4px 8px rgba(0,0,0,.45);transition:all .08s}
.hw-dpad button:active{background:#0284c7;transform:scale(.92);box-shadow:0 0 14px #38bdf8}

.hw-sprint-btn{border:2px solid #ca8a04;background:linear-gradient(135deg,#78350f,#451a03);color:#fef08a;font-size:11.5px;font-weight:950;padding:8px 12px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 14px rgba(0,0,0,.45);cursor:pointer;transition:all .15s}
.hw-sprint-btn.active{border-color:#fde047;background:linear-gradient(135deg,#eab308,#ca8a04);color:#1e1b4b;box-shadow:0 0 20px rgba(250,204,21,.75)}

.hw-action-panel{pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hw-attack-station-btn{border:2.5px solid #fde047;background:linear-gradient(135deg,#eab308,#ca8a04);color:#1e1b4b;font-weight:950;font-size:14.5px;padding:12px 20px;border-radius:16px;box-shadow:0 8px 24px rgba(234,179,8,.55);animation:pulse 1.2s infinite;cursor:pointer}
.hw-attack-station-btn.pulse-urgent{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-color:#fecaca;box-shadow:0 0 28px rgba(239,68,68,.85)}
.hw-hint-pill{background:rgba(15,23,42,.92);border:1.5px solid rgba(255,255,255,.25);color:#e2e8f0;padding:7px 14px;border-radius:12px;font-size:12px;font-weight:800;backdrop-filter:blur(4px);box-shadow:0 6px 14px rgba(0,0,0,.4)}

/* Cửa sổ Chiến Đấu Cuộn Giấy Cổ (Battle Scroll Modal giống hunt-preview) */
.hw-battle-backdrop{position:fixed;inset:0;background:rgba(9,13,26,.85);z-index:70;display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px)}
.hw-battle-modal{width:min(960px,100%);background:linear-gradient(160deg,#fdf6e3 0%,#f5e6c4 100%);border:4px solid #8b5e2b;border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.78),inset 0 0 0 2px #c8a96e;color:#3d2a14;overflow:hidden;display:grid;grid-template-columns:1.4fr .85fr;position:relative;max-height:92vh}
.hw-battle-scroll{padding:20px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto}
.hw-scroll-kicker{display:inline-flex;align-items:center;gap:6px;background:#8b5e2b;color:#fffdf5;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.06em;width:fit-content;margin-bottom:8px}
.hw-scroll-role{background:rgba(139,94,43,.12);border-left:4px solid #8b5e2b;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:800;color:#5d3a18;margin-bottom:10px}
.hw-scroll-question{font-size:clamp(16px,1.8vw,19.5px);font-weight:900;color:#2b1b0c;line-height:1.45;margin-bottom:12px;padding:12px 14px;background:rgba(255,255,255,.72);border:1.5px solid #d6c096;border-radius:14px}
.hw-scroll-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.hw-opt-btn{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;border:2px solid #c8a96e;background:#fffdf7;color:#3d2a14;font-weight:850;font-size:15px;text-align:left}
.hw-opt-btn span.opt-letter{width:30px;height:30px;border-radius:8px;background:#c8a96e;color:#3d2a14;display:grid;place-items:center;font-family:monospace;font-weight:900;flex-shrink:0}
.hw-opt-btn.selected{background:linear-gradient(135deg,#8b5e2b,#6b441d);color:#fffdf5;border-color:#5d3a18;box-shadow:0 4px 12px rgba(93,58,24,.35)}
.hw-opt-btn.selected span.opt-letter{background:rgba(255,255,255,.25);color:#fff}
.hw-short-box{display:flex;gap:8px;align-items:center;margin-bottom:12px;background:rgba(255,255,255,.6);padding:8px 11px;border-radius:12px;border:1.5px dashed #b08d57}
.hw-short-box input{flex:1;border:1.5px solid #c8a96e;border-radius:9px;padding:8px 11px;background:#fff;color:#2b1b0c;font-weight:800}
.hw-scroll-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:2px dashed rgba(139,94,43,.3);flex-wrap:wrap}
.hw-btn-flee{border:2px solid #c8a96e;background:#fdf6e3;color:#6b4d28;border-radius:12px;padding:10px 15px;font-weight:800}
.hw-btn-attack{border:2px solid #c8a96e;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border-radius:12px;padding:11px 22px;font-weight:900;font-size:15px;box-shadow:0 6px 16px rgba(185,28,28,.4)}
.hw-monster-stage{background:radial-gradient(circle at 50% 40%,#3b2d54 0%,#130f1e 85%);color:#fff;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border-left:3px solid #8b5e2b;text-align:center}
.hw-monster-hp{width:88%;background:#0f0a06;border:2px solid #c8a96e;border-radius:99px;height:15px;overflow:hidden;margin-bottom:8px}
.hw-monster-hp i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f97316);transition:width .35s}
.hw-monster-art-wrap{width:165px;height:165px;display:grid;place-items:center;margin:8px 0;position:relative;animation:float 2.4s ease-in-out infinite}
.hw-monster-art-wrap.defeated{transform:scale(.2) rotate(25deg);opacity:.15;transition:all .5s}
.hw-monster-impact{position:absolute;font-size:84px;animation:hwPop .5s ease-out;z-index:5}
.hw-letter-reward-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(22,163,74,.96),rgba(20,83,45,.98));z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff}
.hw-letter-card{width:118px;height:118px;border-radius:24px;background:linear-gradient(160deg,#fffdf5,#f3e3c2);color:#15803d;border:4px solid #facc15;display:grid;place-items:center;font-size:30px;font-weight:950;box-shadow:0 0 35px rgba(250,204,21,.8);animation:hwLetterFly .65s cubic-bezier(.34,1.56,.64,1)}

/* ═══════════════════════════════════════════════════════════════════════════
   ENGINE 2: BẢO VỆ THÀNH TRÌ (AAA CASTLE DEFENSE REAL-TIME)
   ═══════════════════════════════════════════════════════════════════════════ */
.cd-game{background:#181009;color:#fff4dc;border:3px solid #8c5820;border-radius:18px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.cd-game.shake{animation:screenShake .45s ease-in-out}
.cd-hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:linear-gradient(180deg,#2c1b10,#1a1009);border-bottom:3px solid #7c4d1b;flex-wrap:wrap}
.cd-hud-stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}
.cd-stat{display:flex;align-items:center;gap:8px;background:rgba(15,9,5,.78);border:1.5px solid #8d5b24;border-radius:12px;padding:6px 11px;min-width:115px}
.cd-stat-icon{font-size:20px}
.cd-stat small{display:block;font-size:10px;color:#e7cfa1;font-weight:800;text-transform:uppercase}
.cd-stat strong{font-size:14px;color:#fff7df;font-weight:950}
.cd-bar{width:100%;height:7px;background:#0e0905;border-radius:99px;overflow:hidden;margin-top:3px;border:1px solid #472c11}
.cd-bar i{display:block;height:100%;border-radius:99px;transition:width .25s}
.cd-bar.hp i{background:linear-gradient(90deg,#ef4444,#84cc16)}
.cd-bar.xp i{background:linear-gradient(90deg,#0ea5e9,#67e8f9)}

.cd-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px}
.cd-main-col{display:flex;flex-direction:column;min-width:0}

/* Chiến trường 3 làn đường (Battlefield) */
.cd-battlefield{position:relative;height:305px;overflow:hidden;border-bottom:4px solid #593714;background:linear-gradient(180deg,#0f172a 0%,#1e3a8a 28%,#3b7a2a 29%,#2f6321 64%,#234d18 100%);isolation:isolate}
.cd-sky-decor{position:absolute;top:10px;left:18px;color:rgba(255,255,255,.85);font-size:12.5px;font-weight:900;letter-spacing:1.2px;z-index:3;pointer-events:none;background:rgba(9,13,26,.55);padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.2)}
.cd-lane-guide{position:absolute;left:17%;right:0;height:28px;transform:translateY(-50%);background:linear-gradient(90deg,rgba(255,235,170,.12),rgba(255,235,170,.05));border-top:1.5px dashed rgba(255,248,196,.22);border-bottom:1.5px dashed rgba(255,248,196,.22);pointer-events:none}
.cd-lane-0{top:44%}
.cd-lane-1{top:65%}
.cd-lane-2{top:86%}

/* Tia Đại Bác Laser Oxyz khi trả lời đúng */
.cd-laser-beam{position:absolute;left:14%;right:0;top:35%;height:110px;background:linear-gradient(180deg,transparent,rgba(56,189,248,.45),#fef08a,rgba(56,189,248,.45),transparent);z-index:19;pointer-events:none;mix-blend-mode:screen;animation:laserPulse .65s ease-out forwards}

/* Thời tiết / Hiệu ứng Kỹ năng toàn chiến trường */
.cd-weather-freeze{position:absolute;inset:0;background:radial-gradient(circle,rgba(56,189,248,.12),rgba(14,165,233,.28));border:2px solid rgba(125,211,252,.6);z-index:14;pointer-events:none}

/* Dock 4 Kỹ năng chủ động góc trên phải Chiến trường */
.cd-skill-dock{position:absolute;top:10px;right:10px;z-index:22;display:flex;gap:6px;padding:5px;background:rgba(16,11,8,.86);border:2px solid rgba(250,204,21,.7);border-radius:12px;backdrop-filter:blur(4px)}
.cd-skill-btn{width:50px;height:50px;border-radius:10px;border:2px solid #855823;background:linear-gradient(160deg,#2b1c10,#140c06);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;position:relative;font-size:20px}
.cd-skill-btn small{font-size:8.5px;font-weight:900;color:#fde68a;line-height:1}
.cd-skill-btn.active{border-color:#38bdf8;background:linear-gradient(160deg,#0369a1,#0c4a6e);box-shadow:0 0 14px #38bdf8}
.cd-skill-btn.cooldown{opacity:.6;cursor:not-allowed}
.cd-skill-cd{position:absolute;inset:0;background:rgba(0,0,0,.74);border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:950;color:#facc15}

/* Thành trì & Khiên chắn bên trái */
.cd-castle{position:absolute;left:1%;bottom:4%;width:130px;height:84%;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cd-castle-art{width:112px;height:135px;filter:drop-shadow(6px 8px 10px rgba(0,0,0,.55))}
.cd-castle-tag{background:rgba(18,12,7,.92);border:1.5px solid #eab308;color:#fef08a;padding:2px 9px;border-radius:8px;font-size:10.5px;font-weight:900;white-space:nowrap;margin-top:2px}
.cd-castle-shield{position:absolute;inset:2% -12% 2% -4%;border:4px solid rgba(56,189,248,.9);border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.15),rgba(14,165,233,.38));box-shadow:0 0 28px rgba(56,189,248,.85),inset 0 0 18px rgba(56,189,248,.65);animation:pulse 1.5s infinite;pointer-events:none}

/* 3 Anh Hùng trấn giữ 3 làn */
.cd-hero{position:absolute;left:15.5%;transform:translate(-50%,-50%);z-index:6;display:flex;flex-direction:column;align-items:center}
.cd-hero-sprite{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fef3c7,#d97706);border:2.5px solid #fff;display:grid;place-items:center;font-size:25px;box-shadow:0 5px 12px rgba(0,0,0,.55)}
.cd-hero-label{font-size:9.5px;font-weight:900;background:rgba(0,0,0,.8);color:#fde68a;padding:1px 6px;border-radius:6px;margin-top:2px;white-space:nowrap;border:1px solid rgba(250,204,21,.4)}

/* Quái vật di chuyển trên 3 làn */
.cd-enemy{position:absolute;transform:translate(-50%,-50%);z-index:7;display:flex;flex-direction:column;align-items:center;transition:left 50ms linear}
.cd-enemy-hp{width:44px;height:6px;background:#1c1917;border:1px solid #000;border-radius:99px;overflow:hidden;margin-bottom:2px}
.cd-enemy-hp i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f97316)}
.cd-enemy-sprite{font-size:36px;line-height:1;filter:drop-shadow(0 5px 6px rgba(0,0,0,.5))}
.cd-enemy.is-boss .cd-enemy-sprite{font-size:52px;filter:drop-shadow(0 0 12px rgba(239,68,68,.8))}
.cd-enemy.is-slowed .cd-enemy-sprite{filter:drop-shadow(0 0 8px #38bdf8) hue-rotate(160deg)}

/* Đạn bắn & Hiệu ứng nổ sát thương */
.cd-proj{position:absolute;transform:translate(-50%,-50%);z-index:8;font-size:19px;pointer-events:none;filter:drop-shadow(0 0 6px #fde047)}
.cd-fx{position:absolute;transform:translate(-50%,-50%);z-index:15;font-weight:950;font-size:15px;color:#fde047;text-shadow:0 2px 4px #000;pointer-events:none;animation:cdFloatUp .75s ease-out forwards;white-space:nowrap}
.cd-fx.crit{font-size:20px;color:#4ade80}
.cd-fx.hit-castle{color:#f87171;font-size:18px}

/* Khu vực Câu Hỏi Toán Học dưới Chiến trường (Question Dock) */
.cd-question-dock{background:linear-gradient(180deg,#f7ebd2,#edd8b1);color:#2d1d0e;padding:16px 18px}
.cd-q-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.cd-q-badge{background:#7c4a15;color:#fff7e0;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:900}
.cd-q-reward{background:#15803d;color:#fff;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:900}
.cd-q-prompt{font-size:clamp(16px,1.85vw,19.5px);font-weight:900;color:#231508;background:rgba(255,255,255,.76);border:2px solid #c69c63;border-radius:13px;padding:11px 14px;margin-bottom:11px;line-height:1.45}
.cd-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.cd-ans-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid #966125;background:linear-gradient(180deg,#fff9ea,#f3dfb9);color:#2d1d0e;font-weight:900;font-size:15px;text-align:left;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 3px 0 #794815}
.cd-ans-btn:hover:not(:disabled){background:linear-gradient(180deg,#fffdf5,#fae8c6)}
.cd-ans-btn span.ans-letter{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#a66a20,#70400f);color:#fff4c7;display:grid;place-items:center;font-size:13px;font-weight:950;flex-shrink:0}
.cd-q-InputRow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cd-q-InputRow input{flex:1;min-width:160px;border:2px solid #966125;border-radius:10px;padding:8px 12px;background:#fffaf0;color:#26180d;font-weight:800}

/* Cột phải: Bảng Nâng Cấp Đội Quân (Upgrade Panel) */
.cd-upgrade-panel{background:linear-gradient(180deg,#23160c,#160d07);border-left:3px solid #6e4215;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.cd-up-title{font-size:13px;font-weight:950;color:#fcd34d;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.cd-up-list{display:flex;flex-direction:column;gap:8px}
.cd-up-item{background:rgba(255,255,255,.05);border:1.5px solid #6e4215;border-radius:12px;padding:9px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cd-up-info b{display:block;font-size:12.5px;color:#fff4dc}
.cd-up-info small{font-size:11px;color:#fbbf24;font-weight:800}
.cd-up-buy{border:1.5px solid #f59e0b;background:linear-gradient(180deg,#d97706,#92400e);color:#fff;border-radius:9px;padding:6px 10px;font-size:11.5px;font-weight:900;white-space:nowrap}
.cd-up-buy:disabled{opacity:.45;border-color:#57534e;background:#292524}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,.55)}50%{box-shadow:0 0 0 8px rgba(250,204,21,0)}}
@keyframes hwSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes hwBounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-5px) scale(1.05)}}
@keyframes hwRipple{0%{width:12px;height:12px;opacity:1}100%{width:70px;height:70px;opacity:0}}
@keyframes hwPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes hwLetterFly{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes cdFloatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-34px);opacity:0}}
@keyframes laserPulse{0%{opacity:0;transform:scaleY(.2)}35%{opacity:1;transform:scaleY(1.15)}100%{opacity:0;transform:scaleY(.1)}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}

/* Hiệu ứng Pháo hoa Confetti ăn mừng chiến thắng */
.confetti-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}

/* Định dạng Công thức Toán học chuẩn mực */
.math-vec{position:relative;display:inline-block;padding:0 2px;font-style:normal;font-weight:900}
.math-vec i{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:11px;font-style:normal;font-weight:900;line-height:1}
.math-sym{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;font-weight:bold;font-size:1.05em}
.math-coord{font-family:monospace;background:rgba(0,0,0,.06);padding:2px 6px;border-radius:6px;font-weight:800;border:1px solid rgba(0,0,0,.08)}
.math-tag{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;color:#166534;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:900}

/* Thanh thông báo/nhắn gửi nhanh của Giáo viên */
.teacher-broadcast-bar{background:linear-gradient(110deg,#fef3c7,#fef08a);border:2px solid #f59e0b;color:#78350f;padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:850;display:flex;align-items:center;gap:10px;margin-bottom:14px;box-shadow:0 6px 16px rgba(245,158,11,.25);animation:pulse 1.8s infinite}

@media(max-width:1050px){
  .teacher-main,.mission-wrapper,.cd-layout,.oxyz-canvas-wrap{grid-template-columns:1fr}
  .world-journey-map{grid-template-columns:repeat(3,minmax(0,1fr))}
  .world-journey-map:before{display:none}
  .cd-upgrade-panel{border-left:0;border-top:3px solid #6e4215}
  .cd-up-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .role-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:720px){
  .wrap{padding:12px 10px 45px}
  .hero{border-radius:20px;padding:24px 18px;min-height:210px}
  .hero-character{font-size:70px;right:10px;top:30px;opacity:.4}
  .grid-2,.grid-3,.grid-4,.cd-answers,.hw-scroll-options,.cd-up-list,.role-strip,.world-journey-map{grid-template-columns:1fr}
  .hw-battle-modal{grid-template-columns:1fr}
  .hw-monster-stage{border-left:0;border-top:3px solid #8b5e2b;padding:16px}
  .hw-viewport{height:390px}
  .cd-battlefield{height:245px}
}


/* ═══════════════════════════════════════════════════════════════════════════
   STYLE NÂNG CẤP CHẶNG 3, 4, 5: SỔ MẬT THƯ, LƯỚI TỌA ĐỘ & BOSS OXYZ
   ═══════════════════════════════════════════════════════════════════════════ */

/* SỔ MẬT THƯ (CIPHER NOTEBOOK MODAL) */
.hw-cipher-backdrop{position:fixed;inset:0;background:rgba(4,8,18,.82);backdrop-filter:blur(8px);z-index:92;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .25s ease-out}
.hw-cipher-modal{background:linear-gradient(145deg,#1e1b4b,#0f172a);border:3px solid #facc15;border-radius:24px;box-shadow:0 16px 48px rgba(0,0,0,.7),0 0 32px rgba(250,204,21,.3);max-width:620px;width:100%;color:#fff;overflow:hidden;animation:modalZoomIn .3s ease-out;display:flex;flex-direction:column}

.hw-cipher-slot-idx{font-size:10.5px;color:#94a3b8;font-weight:800;position:absolute;top:4px}
.hw-cipher-slot-char{font-size:32px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hw-cipher-slot.filled:hover{transform:translateY(-2px);border-color:#f43f5e}
.hw-cipher-tray-label{font-size:12px;font-weight:900;color:#fde047;text-transform:uppercase;letter-spacing:.8px}

.hw-cipher-error{background:rgba(239,68,68,.15);border:1.5px solid #ef4444;color:#fecaca;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.hw-cipher-success{background:rgba(16,185,129,.18);border:1.5px solid #10b981;color:#a7f3d0;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:850;display:flex;align-items:center;gap:10px}

function publicStageDemo(s, round, team){
 const isBoss = Boolean(s.bossChallenge && team && team.bossReady);
 const q = isBoss ? s.bossChallenge : (s.challenges[round] || s.challenges[s.challenges.length - 1]);
 return {
  id: s.id,
  title: s.title,
  subtitle: s.subtitle || '',
  place: s.place,
  icon: s.icon,
  tag: s.tag,
  time: s.time,
  biomeColor: s.biomeColor || '#3b82f6',
  item: s.item || '',
  visual3D: s.visual3D || null,
  story: s.story,
  groupTask: s.groupTask,
  gameType: s.gameType,
  defaultMode: s.defaultMode || (s.id === 2 ? 'defense' : 'hunt'),
  teamRoles: s.teamRoles || [],
  huntMap: s.huntMap || null,
  defenseConfig: s.defenseConfig || null,
  cipher: s.cipher || null,
  cipherHint: s.cipherHint || null,
  cipherLetters: s.cipherLetters || null,
  cipherReady: Boolean(team && (team.cipherReady || round >= s.challenges.length)),
  bossReady: Boolean(team && team.bossReady),
  allRounds: s.challenges.map((c, i) => ({
   index: i,
   label: c.label,
   keyBadge: c.keyBadge || ('Mảnh ' + (i + 1)),
   cipherPiece: c.cipherPiece || null,
   targetGrid: c.targetGrid || null,
   monster: c.monster || { icon: '👾', name: 'Quái Vật', hp: 100 }
  })),
  round: Math.min(round, s.challenges.length),
  totalRounds: s.challenges.length,
  isBoss,
  challenge: {
   label: q.label,
   prompt: q.prompt,
   options: q.options,
   roleAssign: q.roleAssign || '',
   highlightAxis: q.highlightAxis || 'all',
   monster: q.monster || { icon: '👾', name: 'Quái Vật Trạm', hp: 120, type: 'golem' },
   keyBadge: q.keyBadge || '',
   cipherPiece: q.cipherPiece || null,
   targetGrid: q.targetGrid || null,
   hasShortAnswer: Boolean(q.shortAnswer)
  }
 };
}

let demoRoom = initDemo();
function offEvent(txt){ demoRoom.events.push({ text: txt, at: new Date().toISOString() }); if (demoRoom.events.length > 50) demoRoom.events.shift(); }
function offErr(msg){ throw new Error(msg); }
function normAns(s){ return String(s ?? '').trim().replace(/\u2212/g, '-').replace(/\s+/g, '').toUpperCase(); }

function offState(d){
 let r = demoRoom;
 let gv = d.token === r.teacherToken;
 let t = r.teams.find(x => x.token === d.token);
 if (!gv && !t) offErr('Mã truy cập không hợp lệ.');
 const teams = r.teams.map(x => ({
  id: x.id, name: x.name, avatar: x.avatar, color: x.color,
  stage: x.stage, round: x.round, health: x.health, wrong: x.wrong,
  score: x.score, bonus: x.bonus, gold: x.gold, heroLevel: x.heroLevel,
  streak: x.streak || 0, upgrades: x.upgrades, completed: x.completed,
  finishedAt: x.finishedAt, cipherReady: Boolean(x.cipherReady), bossReady: Boolean(x.bossReady)
 }));
 let clk = { ...r.clock };
 if (clk.running) clk.remainingMs = Math.max(0, clk.remainingMs - (Date.now() - clk.startedAt));
 let data = {
  room: r.id, role: gv ? 'teacher' : 'student', teams, paused: r.paused, clock: clk,
  stages: offStages.map(m => ({
   id: m.id, title: m.title, subtitle: m.subtitle || '', icon: m.icon, place: m.place,
   tag: m.tag, biomeColor: m.biomeColor || '#3b82f6', item: m.item || '',
   gameType: m.gameType, defaultMode: m.defaultMode, totalRounds: m.challenges.length
  })),
  messageOptions: offOptions,
  lastEvent: r.events.slice(-15).reverse(),
  createdAt: new Date().toISOString(),
  joinBaseURL: 'Bản chơi thử 1 máy'
 };
 if (gv) {
  return {
   ...data,
   teamCodes: Object.fromEntries(r.teams.map(x => [x.id, x.code])),
   missions: offStages.map(m => ({ ...m, challenges: m.challenges.map(q => ({ ...q, answer: 'ABCD'[q.correct] })) })),
   teacherToken: r.teacherToken, cipher: '30524', cipherWords: offWords
  };
 }
 let m = offStages[t.stage];
 return {
  ...data,
  me: { ...t, streak: t.streak || 0, cipherReady: Boolean(t.cipherReady), bossReady: Boolean(t.bossReady) },
  current: m ? publicStageDemo(m, t.round, t) : null,
  cipherWords: t.stage >= 5 ? offWords : null
 };
}

async function demoApi(route, d){
 let r = demoRoom;
 if (route === '/api/create') { r = demoRoom = initDemo(); return { room: r.id, teacherToken: r.teacherToken }; }
 if (route === '/api/join') {
  let team = r.teams.find(x => x.id === d.team && x.code === String(d.code));
  if (!team) offErr('Sai mã đội. Đội 1: 1111 · Đội 2: 2222 · Đội 3: 3333 · Đội 4: 4444');
  return { room: r.id, team: team.id, token: team.token };
 }
 if (route === '/api/state') return offState(d);
 let t = r.teams.find(x => x.token === d.token);
 if (route === '/api/teacher') {
  if (d.token !== r.teacherToken) offErr('Chỉ GV được thao tác');
  if (d.action === 'bonus') { let x = r.teams.find(x => x.id === d.team); x.score += Number(d.value) - x.bonus; x.bonus = Number(d.value); }
  else if (d.action === 'pause') { r.paused = !r.paused; }
  else if (d.action === 'broadcast') { offEvent('📢 THÔNG BÁO TỪ GV: ' + d.message); }
  else if (d.action === 'healAll') { r.teams.forEach(x => { x.health = 3; }); offEvent('💖 GIÁO VIÊN ĐÃ HỒI ĐẦY 3 KHIÊN CHO TẤT CẢ CÁC ĐỘI!'); }
  else if (d.action === 'bonusAll') { r.teams.forEach(x => { x.score += 5; x.gold = (x.gold || 120) + 50; }); offEvent('✨ GIÁO VIÊN THƯỞNG NÓNG +5 XP VÀ +50 VÀNG CHO TOÀN BỘ CÁC ĐỘI!'); }
  else if (d.action === 'resetTeam') { let x = r.teams.find(x => x.id === d.team); let base = initDemo().teams.find(v => v.id === d.team); Object.assign(x, base); }
  else if (d.action === 'timer') {
   if (d.value === 'start') { r.clock.running = true; r.clock.startedAt = Date.now(); }
   else if (d.value === 'pause') { r.clock.remainingMs = Math.max(0, r.clock.remainingMs - (Date.now() - r.clock.startedAt)); r.clock.running = false; }
   else if (d.value === 'reset') { r.clock.running = false; r.clock.remainingMs = r.clock.minutes * 60000; }
   else { r.clock.minutes = Number(d.value); r.clock.remainingMs = Number(d.value) * 60000; r.clock.running = false; }
  }
  return { ok: true };
 }
 if (!t) offErr('Đội chưa đăng nhập');
 if (route === '/api/demoJump') {
  const stg = Math.max(0, Math.min(5, Number(d.stage) || 0));
  t.stage = stg; t.round = 0; t.health = 3; t.completed = false;
  t.cipherReady = false; t.bossReady = false;
  t.digits = offStages.slice(0, stg).map((s, idx) => ({ stage: idx + 1, digit: s.digit, rule: s.digitRule, item: s.item }));
  t.score = stg * 20;
  return { ok: true };
 }
 if (r.paused) offErr('GV đang tạm dừng game');

 if (route === '/api/answer') {
  const idx = t.stage, s = offStages[idx];
  const isBoss = Boolean(s.bossChallenge && t.bossReady);
  const round = isBoss ? s.challenges.length : t.round;
  const q = isBoss ? s.bossChallenge : s.challenges[round];

  let isCorrect = false;
  if (d.shortText !== undefined && String(d.shortText).trim() !== '') {
   const given = normAns(d.shortText);
   const targetShort = normAns(q.shortAnswer);
   const targetOpt = normAns(q.options[q.correct]);
   const targetLetter = String.fromCharCode(65 + q.correct);
   isCorrect = (targetShort && given === targetShort) || given === targetOpt || given === targetLetter;
  } else {
   isCorrect = (Number(d.choice) === q.correct);
  }

  if (isCorrect) {
   t.streak = (t.streak || 0) + 1;
   const comboBonus = Math.min(4, t.streak - 1) * 30;

   if (isBoss) {
    const pts = 25;
    t.stage++; t.round = 0; t.bossReady = false; t.health = 3; t.score += pts; t.gold += 150;
    t.heroLevel = Math.min(6, (t.heroLevel || 1) + 1);
    t.digits.push({ stage: idx + 1, digit: s.digit, rule: s.digitRule, item: s.item });
    offEvent('🏆 ' + t.avatar + ' ' + t.name + ' bắn Laser hạ Boss Bóng Đen Lãng Quên! Thành Trì đã được bảo vệ!');
    return {
     correct: true, points: pts, goldEarned: 150, comboBonus, streak: t.streak,
     gold: t.gold, heroLevel: t.heroLevel, explain: q.explain, bossDefeated: true,
     stageFinished: true, digit: s.digit, digitRule: s.digitRule, item: s.item,

   t.gold = (t.gold || 100) + goldEarned;

   if (t.round >= s.challenges.length) {

     t.cipherReady = true;

     return {

     };
    } else {
     pts = 20;
     t.stage++; t.round = 0; t.health = 3; t.score += pts; t.gold += 80;

   }

   return {

   };
  }

  t.streak = 0;

  const attempt = t.attempts[idx];

 }

 if (route === '/api/cipher') {

  }
  if (s.id === 4) {
   const pts = 20;
   t.stage++; t.round = 0; t.cipherReady = false; t.health = 3; t.score += pts; t.gold += 100;
   t.heroLevel = Math.min(6, (t.heroLevel || 1) + 1);
   const digit = s.digit;
   t.digits.push({ stage: idx + 1, digit: s.digit, rule: s.digitRule, item: s.item });
   offEvent('🌀 ' + t.avatar + ' ' + t.name + ' giải mã thành công TRUNG và mở Phòng Kho Báu Trung Tâm (+20 XP)!');
   return { correct: true, points: pts, stageFinished: true, digit, digitRule: s.digitRule, item: s.item, nextRound: 0, nextStage: t.stage, health: t.health, score: t.score, message: 'CĂN PHÒNG KHO BÁU TRUNG TÂM ĐÃ ĐƯỢC MỞ KHÓA!' };
  }
  if (s.id === 5) {
   t.cipherReady = false; t.bossReady = true; t.gold += 50;
   offEvent('🛡️ ' + t.avatar + ' ' + t.name + ' ghép BAOVE kích hoạt Lá Chắn Thành Trì! BOSS BÓNG ĐEN XUẤT HIỆN!');
   return { correct: true, bossReady: true, message: 'LÁ CHẮN THÀNH TRÌ ĐÃ ĐƯỢC KÍCH HOẠT! ĐẠI BOSS BÓNG ĐEN ĐANG TỔNG TẤN CÔNG!' };
  }
 }

 if (route === '/api/upgrade') {
  const key = String(d.upgrade || '');
  const curLv = t.upgrades[key] || 1;
  if (curLv >= 5) offErr('Chỉ số này đã đạt cấp tối đa (Lv.5)!');

  t.gold -= cost; t.upgrades[key] = curLv + 1;
  if (key === 'hp' || key === 'regen') t.health = Math.min(3, t.health + 1);
  return { ok: true, gold: t.gold, upgrades: t.upgrades, health: t.health, cost, level: t.upgrades[key] };
 }

 if (route === '/api/hint') {

 }

 if (route === '/api/final') {

 }
 offErr('Tác vụ không hỗ trợ trong bản demo');
}

function project3DPoint(x,y,z,cx=195,cy=112,scale=19){
 const radYaw=oxyz3D.yaw*Math.PI/180;
 const radPitch=oxyz3D.pitch*Math.PI/180;
 // Hệ trục chuẩn Toán THPT: Ox hướng về phía trước-trái, Oy hướng sang phải, Oz hướng thẳng đứng lên
 const rx = -x*Math.sin(radYaw) + y*Math.cos(radYaw);
 const ry = -x*Math.cos(radYaw)*Math.sin(radPitch) - y*Math.sin(radYaw)*Math.sin(radPitch) + z*Math.cos(radPitch);
 return {
  sx: +(cx + rx*scale).toFixed(1),
  sy: +(cy - ry*scale).toFixed(1)
 };
}

     </defs>
     ${gridLines}

function mapTrack(stage){
 const curRound=world?.me?.round||0;
 return `<div class="world-journey-map">${missionMeta.map((m,i)=>{
  const state=stage===-1?'current':i<stage?'done':i===stage?'current':'locked';
  const stars=stage===-1?'⭐⭐⭐':i<stage?'⭐⭐⭐':i===stage?('⭐'.repeat(curRound)+'☆'.repeat(3-curRound)):'☆☆☆';
  const clickAttr=window.IS_DEMO_MODE&&session?.role==='student'?`data-action="demoJumpStage" data-stage="${i}" title="Nhấn để chuyển nhanh tới Chặng ${i+1}"`:'';
  return `<div class="island-card ${state}" style="--biome:${m.biome}" ${clickAttr}>
   <div class="island-orb">
    <span>${i<stage?'✅':m.icon}</span>
    <span class="island-badge">Chặng ${i+1}</span>
   </div>
   <div class="island-stars">${stars}</div>
   <div class="island-title">${esc(m.place)}</div>
   <div class="island-sub">${esc(m.sub)}</div>
   <span class="island-mode-tag">${esc(m.mode)}</span>
  </div>`;
 }).join('')}</div>`;
}

function standings(teams,compact=false){
 const list=[...teams].sort((a,b)=>b.score-a.score||(b.stage-a.stage)||(b.round-a.round)||((a.finishedAt||'9999').localeCompare(b.finishedAt||'9999')));
 if(compact)return list.map((t,i)=>`<div class="mini-rank"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':'🏅'} ${t.avatar} ${esc(t.name)}</span><strong>${t.score} XP</strong></div>`).join('');
 return `<table class="result-table"><thead><tr><th>Hạng</th><th>Đội</th><th>Tiến độ Chặng</th><th>Vàng · Cấp · Combo</th><th>Điểm XP</th><th>Trạng thái</th></tr></thead><tbody>${list.map((t,i)=>`<tr><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${t.avatar} <strong>${esc(t.name)}</strong></td><td><div class="mini-progress"><span style="width:${(t.stage*3+(t.stage<5?t.round:0))/15*100}%"></span></div><small>Chặng ${t.stage}/5 • ${t.stage<5?`lượt ${t.round+1}/3`:'Hoàn tất 5 chặng'}</small></td><td>🪙 ${t.gold??120} · Lv.${t.heroLevel??1} ${(t.streak||0)>=2?`<span class="pill pink">🔥x${t.streak}</span>`:''}</td><td><strong>${t.score} XP</strong></td><td>${t.completed?'<span class="pill green">🏆 Đã mở kho báu</span>':t.stage===5?'<span class="pill gold">🔐 Đang giải mật mã</span>':'⚔️ Đang chiến đấu'}</td></tr>`).join('')}</tbody></table>`;
}

 const cipherLetters = m.cipherLetters || (m.cipher ? m.cipher.split('') : ['P','H','A','L','E']);
 const isReady = Boolean(m.cipherReady || world.me?.cipherReady);
 const earnedLetters = isReady ? [...cipherLetters] : (m.allRounds || []).slice(0, m.round).map(r => r.cipherPiece).filter(Boolean);
 
 const placedLetters = cipherState.slots.filter(Boolean);
 const availableChips = [...earnedLetters];
 placedLetters.forEach(ch => {
  const idx = availableChips.indexOf(ch);
  if (idx !== -1) availableChips.splice(idx, 1);
 });
 
 const slotsHtml = [0, 1, 2, 3, 4].map(idx => {
  const val = cipherState.slots[idx];
  if (val) {
   return `<div class="hw-cipher-slot filled" data-action="removeCipherSlot" data-slot="${idx}" title="Chạm để gỡ chữ">
    <span class="hw-cipher-slot-num">${idx + 1}</span>
    <span class="hw-cipher-slot-letter">${esc(val)}</span>
    <span class="hw-slot-remove-btn">×</span>
   </div>`;
  }
  return `<div class="hw-cipher-slot empty" title="Ô ký tự ${idx + 1}">
   <span class="hw-cipher-slot-num">${idx + 1}</span>
   <span class="hw-cipher-slot-placeholder">?</span>
  </div>`;
 }).join('');
 
 const chipsHtml = availableChips.length ? availableChips.map(ch => `
  <button type="button" class="hw-cipher-chip" data-action="placeCipherChip" data-char="${esc(ch)}" title="Chạm để xếp vào ô tiếp theo">
   ${esc(ch)}
  </button>
 `).join('') : `<span style="color:#94a3b8;font-size:12.5px;font-style:italic">Đã xếp hết các mảnh ký tự vào ô phía trên.</span>`;

 return `<div class="hw-cipher-backdrop">
  <div class="hw-cipher-modal">
   <div class="hw-cipher-header">
    <div>
     <h3 style="margin:0;font-size:16px;font-weight:900">📜 SỔ MẬT THƯ CỔ ĐẠI · ${esc(m.title)}</h3>
     <p style="margin:4px 0 0;font-size:12px;color:#cbd5e1">${esc(m.cipherHint || 'Ghép 5 ký tự cổ thu thập được từ các trạm để mở phong ấn tối thượng!')}</p>
    </div>
    <button type="button" class="hw-btn-flee" data-action="closeCipherNotebook" title="Đóng">✕</button>
   </div>
   <div class="hw-cipher-body">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
     <span style="font-size:12px;font-weight:900;color:#fde047">
      🗝️ TIẾN ĐỘ THU THẬP: ${earnedLetters.length}/${cipherLetters.length} MẢNH RUNE
     </span>
     <span class="pill ${isReady?'green':'gold'}" style="font-size:11px">
      ${isReady ? '✨ ĐỦ 5 MẢNH – SẴN SÀNG GIẢI MÃ' : 'Đang thu thập mảnh từ các trạm'}
     </span>
    </div>
    <div class="hw-cipher-slots">${slotsHtml}</div>
    <div style="font-size:12px;font-weight:800;color:#94a3b8;margin:12px 0 6px">
     MẢNH RUNE KHẢ DỤNG (CHẠM VÀO ĐỂ ĐẶT VÀO Ô TRỐNG):
    </div>
    <div class="hw-cipher-tray">${chipsHtml}</div>
    ${cipherState.error ? `<div class="hw-cipher-error">⚠️ ${esc(cipherState.error)}</div>` : ''}
    ${cipherState.successMsg ? `<div class="hw-cipher-success">🎉 ${esc(cipherState.successMsg)}</div>` : ''}
   </div>
   <div class="hw-cipher-footer">
    <div style="display:flex;gap:8px">
     <button type="button" class="button gray sm" data-action="resetCipherSlots">↺ Xếp lại từ đầu</button>
     <button type="button" class="button gray sm" data-action="closeCipherNotebook">Đóng sổ</button>
    </div>
    <button type="button" class="button gold" data-action="submitCipherNotebook" ${placedLetters.length < 5 ? 'disabled' : ''}>

    </button>
   </div>
  </div>
 </div>`;
}

function interactNearObject(){
 const m=world?.current;
 if(!m||huntState.battleOpen||cipherState.open)return;
 
 if((m.bossReady||world.me?.bossReady)&&Math.hypot(huntState.x-50,huntState.y-18)<=18){
  huntState.battleOpen=true;
  huntState.selectedChoice=null;
  huntState.shortText='';
  huntState.monsterDefeated=false;
  huntState.rewardBadge=null;
  sound('boss_roar');
  render();
  return;
 }
 
 const curSt=m.huntMap?.stations?.[m.round];
 if(curSt&&Math.hypot(huntState.x-curSt.x,huntState.y-curSt.y)<=12){
  huntState.battleOpen=true;
  huntState.selectedChoice=null;
  huntState.shortText='';
  huntState.monsterDefeated=false;
  huntState.rewardBadge=null;
  render();
  return;
 }
 
 if(m.id===3&&Math.hypot(huntState.x-14,huntState.y-52)<=14){
  questDialogue={
   avatar:'🧙‍♂️',
   name:'Vệ Binh Hang Pha Lê Oxyz',
   role:'Người Canh Cổng Tháp Cổ',
   text:`<p>Chào các chiến binh Toán học! Tòa <b>Tháp Pha Lê Khoảng Cách</b> đang bị phong ấn bởi một kết giới cổ xưa gồm 5 ổ khóa năng lượng.</p>
   <p style="margin-top:8px">Nhiệm vụ của các em: Hãy điều khiển nhân vật khám phá 5 mỏ tinh thể, giải đúng 5 bài toán <b>Độ dài vectơ & Khoảng cách giữa hai điểm trong không gian Oxyz</b> để thu thập 5 mảnh cổ tự <b>P - H - A - L - E</b>.</p>
   <p style="margin-top:8px;color:#fde047">Sau khi thu thập đủ, hãy tới <b>Bàn Giải Mã Trung Tâm</b> tại cuối thung lũng, mở Sổ Mật Thư và ghép chính xác từ khóa <b>PHALE</b> để khai mở cổng tháp!</p>`
  };
  sound('magic');
  render();
  return;
 }
 
 if(m.id===3&&Math.hypot(huntState.x-88,huntState.y-50)<=15){
  cipherState.open=true;
  cipherState.error=null;
  sound('crystal');
  render();
  return;
 }
 
 if(m.id===4&&Math.hypot(huntState.x-89,huntState.y-50)<=15){
  cipherState.open=true;
  cipherState.error=null;
  sound('portal');
  render();
  return;
 }
 
 const q=m.challenge;
 if(m.id===4&&q?.targetGrid){
  const gx=q.targetGrid[0], gy=q.targetGrid[1];
  const px=14+(gx/8)*72, py=80-(gy/6)*62;
  if(Math.hypot(huntState.x-px,huntState.y-py)<=12){
   sound('gem');
   huntState.popups.push({
    id:Date.now(),
    x:px,
    y:py-4,
    text:`🎯 Tọa độ M(${gx}; ${gy}) kích hoạt!`,
    color:'#2dd4bf',
    createdAt:performance.now()
   });
   render();
   return;
  }
 }
 
 if(m.id===5&&Math.hypot(huntState.x-50,huntState.y-50)<=15){
  cipherState.open=true;
  cipherState.error=null;
  sound('energy');
  render();
  return;
 }
}
function updateHuntCamera(){
 const vp=$('#hwViewport'), wd=$('#hwWorld'), pl=$('#hwPlayer');
 if(!vp||!wd||!pl)return;
 pl.style.left=huntState.x+'%';
 pl.style.top=huntState.y+'%';
 pl.classList.toggle('moving',huntState.moving);
 pl.classList.toggle('sprinting',huntState.isSprinting);
 pl.classList.toggle('facing-left',huntState.facing==='left');
 pl.classList.toggle('facing-right',huntState.facing==='right');

 const miniPl=$('#hwMiniPlayer');
 if(miniPl){miniPl.style.left=huntState.x+'%';miniPl.style.top=huntState.y+'%';}

 const targetBeacon=$('#hwTargetBeacon');
 if(targetBeacon){
  if(huntState.targetX!==null&&huntState.targetY!==null){
   targetBeacon.style.display='block';
   targetBeacon.style.left=huntState.targetX+'%';
   targetBeacon.style.top=huntState.targetY+'%';
   const dToTarget=Math.hypot(huntState.targetX-huntState.x,huntState.targetY-huntState.y);
   const lbl=targetBeacon.querySelector('.hw-target-beacon-label');
   if(lbl)lbl.textContent=`${Math.round(dToTarget*1.5)}m`;
  }else{
   targetBeacon.style.display='none';
  }
 }

 const m=world?.current;
 const curSt=m?.huntMap?.stations?.[m.round];
 if(curSt){
  const dx=curSt.x-huntState.x, dy=curSt.y-huntState.y;
  const dist=Math.hypot(dx,dy);
  const angleDeg=Math.round(Math.atan2(dy,dx)*180/Math.PI);
  const arr=$('#hwCompassArrow'), txt=$('#hwCompassText');
  if(arr)arr.style.transform=`rotate(${angleDeg}deg)`;
  if(txt)txt.textContent=`${curSt.name} (${Math.round(dist*1.5)}m)`;

  const atkBtn=$('.hw-attack-station-btn');
  const expPill=$('.hw-exploring-pill');
  const isNear=dist<=10.5;
  if(atkBtn){
   if(isNear){
    atkBtn.style.display='inline-flex';
    atkBtn.innerHTML=`⚔️ ĐÃ TỚI ĐỀN ${m.round+1}! BẤM MỞ BÀI TOÁN (Space)`;
    atkBtn.classList.add('pulse-urgent');
    if(expPill)expPill.style.display='none';
   }else{
    atkBtn.style.display='none';
    if(expPill){
     expPill.style.display='flex';
     const dLabel=expPill.querySelector('.hw-exploring-dist');
     if(dLabel)dLabel.textContent=`Còn ${Math.round(dist*1.5)}m`;
    }
   }
  }
 }
 const vw=vp.clientWidth||800, vh=vp.clientHeight||485;
 const ww=1200, wh=820;
 const px=huntState.x/100*ww, py=huntState.y/100*wh;
 const tx=Math.min(0,Math.max(vw-ww,vw/2-px));
 const ty=Math.min(0,Math.max(vh-wh,vh/2-py));
 wd.style.transform=`translate3d(${Math.round(tx)}px,${Math.round(ty)}px,0)`;
}

  cdState.enemies=[];

function spawnCastleWaveEnemies(m){
 if(!m||!m.defenseConfig)return;
 const w=m.defenseConfig.waves?.[m.round]||{name:'Đợt tấn công',enemies:['goblin','bat','skeleton'],boss:'👹'};
 const list=w.enemies||['goblin','bat','skeleton'];
 const spriteMap={goblin:'👺',bat:'🦇',skeleton:'💀',orc:'👹'};
 list.forEach((kind,idx)=>{
  const hp=75+m.id*20+m.round*15;
  cdState.enemies.push({
   id:'en-'+(++cdState.seq),
   lane:idx%3,
   x:84+idx*5,
   hp, maxHp:hp,
   speed:2.1+(idx%2)*0.4,
   sprite:spriteMap[kind]||'👺',
   isBoss:false
  });
 });
 const bossHp=160+m.id*35+m.round*25;
 cdState.enemies.push({
  id:'boss-'+(++cdState.seq),
  lane:1,
  x:94,
  hp:bossHp, maxHp:bossHp,
  speed:1.45,
  sprite:w.boss||m.challenge?.monster?.icon||'👹',
  isBoss:true
 });
}

function triggerConfetti(duration=2600){
 const canvas=document.createElement('canvas');
 canvas.className='confetti-canvas';
 document.body.appendChild(canvas);
 const ctx=canvas.getContext('2d');
 const w=canvas.width=window.innerWidth, h=canvas.height=window.innerHeight;
 const colors=['#f59e0b','#ef4444','#10b981','#3b82f6','#a855f7','#ec4899','#facc15'];
 const pieces=Array.from({length:75},()=>({
  x:Math.random()*w,
  y:Math.random()*-h*0.5,
  w:Math.random()*10+6,
  h:Math.random()*6+4,
  color:colors[Math.floor(Math.random()*colors.length)],
  vx:(Math.random()-0.5)*3.5,
  vy:Math.random()*4+2.5,
  rot:Math.random()*360,
  vRot:(Math.random()-0.5)*12
 }));
 const start=performance.now();
 function anim(now){
  ctx.clearRect(0,0,w,h);
  pieces.forEach(p=>{
   p.x+=p.vx; p.y+=p.vy; p.rot+=p.vRot;
   ctx.save();
   ctx.translate(p.x,p.y);
   ctx.rotate(p.rot*Math.PI/180);
   ctx.fillStyle=p.color;
   ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
   ctx.restore();
  });
  if(now-start<duration){
   requestAnimationFrame(anim);
  }else{
   canvas.remove();
  }
 }
 requestAnimationFrame(anim);
}

function setClock(){clockBase=world?.clock||null;tickBase=Date.now();updateClock();}
function updateClock(){
 if(!clockBase)return;
 const node=$('#clock');if(!node)return;
 let remaining=clockBase.remainingMs-(clockBase.running?Date.now()-tickBase:0);
 remaining=Math.max(0,remaining);
 const sec=Math.floor(remaining/1000);
 node.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
 node.classList.toggle('warn',sec<=300);
}

async function refresh(force=false){
 if(!session||busy)return;
 try{
  const d=await api('/api/state',{room:session.room,token:session.token});
  world=d;setClock();
  if(session.role==='student'&&!force){
   const me=d.me||{};
   const studentKey=`${me.stage}_${me.round}_${me.completed}_${d.paused}`;
   if(studentKey===lastStudentKey){
    const ranksEl=$('#studentSidebarRanks');
    if(ranksEl)ranksEl.innerHTML=standings(d.teams,true);
    const rank=[...d.teams].sort((a,b)=>b.score-a.score),mineRank=rank.findIndex(t=>t.id===me.id)+1;

    if(metricsEl)metricsEl.innerHTML=`<div class="metric"><b>${me.score}</b><small>XP CỦA ĐỘI</small></div><div class="metric"><b>#${mineRank}</b><small>HẠNG TẠM THỜI</small></div>`;
    return;
   }
   lastStudentKey=studentKey;
  }
  if(session.role==='student'&&d.me){
   lastStudentKey=`${d.me.stage}_${d.me.round}_${d.me.completed}_${d.paused}`;
  }
  let slim={...d,clock:{...d.clock,remainingMs:0}};
  const sig=JSON.stringify(slim);
  if(force||sig!==lastSignature){
   lastSignature=sig;
   const focused=document.activeElement?.matches('input,select,textarea');
   if(modal||focused||huntState.battleOpen)return;
   render();
  }
 }catch(e){
  if(force){session=null;world=null;startScreen(e.message);}
 }
}

    {explain:result.explain,goldEarned:result.goldEarned||120,streak:result.streak,button:`Tiếp tục Đợt ${result.nextRound+1}/3 →`});
   updateAfterAction();
  }
 }else{
  sound('wrong');
  cdState.shakeUntil=performance.now()+450;
  const x=result.health===0?'Đội đã cạn khiên nhưng NOVA đã sạc lại năng lượng để đội thử tiếp! ':'';

async function submitCipherNotebook(){
 const m=world?.current;
 if(!m)return;
 const word=cipherState.slots.join('').toUpperCase();
 if(word.length<5){
  cipherState.error='Vui lòng điền đủ 5 ký tự vào 5 ô mật mã.';
  render();
  return;
 }
 cipherState.solving=true;
 cipherState.error=null;
 render();
 try{
  const res=await submit('/api/cipher',{cipher:word});
  if(res.correct){
   sound('crystal');
   sound('win');
   triggerConfetti(3500);
   cipherState.successMsg=res.message||'GIẢI MÃ THÀNH CÔNG!';
   cipherState.error=null;
   render();
   setTimeout(()=>{
    cipherState.open=false;
    cipherState.slots=[null,null,null,null,null];
    cipherState.successMsg=null;
    if(res.bossReady){
     world.me.bossReady=true;
     notice('🛡️ LÁ CHẮN THÀNH TRÌ ĐÃ KÍCH HOẠT!','Đại Boss Bóng Đen Lãng Quên đang tiến vào! Hãy tiến lên phía trên để nghênh chiến!',true,{button:'Tiến lên nghênh chiến!'});
    }else if(res.stageFinished){
     notice('🏆 KHAI MỞ PHONG ẤN THÀNH CÔNG!',`Đội đã mở khóa ${m.place}! Nhận mảnh số mật mã "${res.digit}" (${res.digitRule})`,true,{digit:res.digit,points:res.points,button:res.nextStage===5?'Tiến tới Mở Rương Lõi Trí Tuệ →':'Bước sang Chặng tiếp theo →'});
    }
    updateAfterAction();
   },1200);
  }else{
   sound('wrong');
   cipherState.error=res.hint||'Mật mã chưa chính xác. Hãy sắp xếp lại các ký tự theo gợi ý!';
   cipherState.solving=false;
   render();
  }
 }catch(err){
  sound('wrong');
  cipherState.error=err.message||'Lỗi khi gửi mật mã. Hãy thử lại.';
  cipherState.solving=false;
  render();
 }
}
